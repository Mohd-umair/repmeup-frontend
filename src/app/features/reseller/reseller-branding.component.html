<div class="p-4 sm:p-6 max-w-2xl mx-auto">
  <div class="flex items-center justify-between mb-6">
    <div>
      <h1 class="text-2xl font-bold text-rep-black dark:text-white flex items-center gap-2">
        <i class="fas fa-palette text-rep-lime"></i> Your Brand
      </h1>
      <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">
        This branding is applied to every client workspace you create. Customers see your brand, not RepMeUp.
      </p>
    </div>
    <a routerLink="/app/reseller/clients" class="text-sm text-gray-500 hover:underline">← Clients</a>
  </div>

  <p *ngIf="error" class="text-sm text-red-500 mb-4" role="alert">{{ error }}</p>

  <div *ngIf="loading" class="p-10 text-center text-gray-400"><i class="fas fa-spinner fa-spin text-2xl"></i></div>

  <form *ngIf="!loading" class="space-y-5 bg-white dark:bg-gray-900/50 rounded-2xl border border-gray-200 dark:border-gray-800 p-6" (ngSubmit)="save()">
    <div class="flex flex-col gap-1">
      <label class="text-sm font-medium text-gray-700 dark:text-gray-300">Logo URL</label>
      <input type="url" name="logo" [(ngModel)]="logo" placeholder="https://yourbrand.com/logo.png"
        class="rounded-lg border border-gray-300 dark:border-gray-700 bg-transparent px-3 py-2 text-sm" />
      <div *ngIf="logo" class="mt-2">
        <img [src]="logo" alt="Logo preview" class="h-10 object-contain" />
      </div>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div class="flex flex-col gap-1">
        <label class="text-sm font-medium text-gray-700 dark:text-gray-300">Primary color</label>
        <div class="flex items-center gap-2">
          <input type="color" name="primary" [(ngModel)]="primaryColor" class="h-9 w-12 rounded border border-gray-300 dark:border-gray-700 bg-transparent" />
          <input type="text" name="primaryHex" [(ngModel)]="primaryColor" class="flex-1 rounded-lg border border-gray-300 dark:border-gray-700 bg-transparent px-3 py-2 text-sm" />
        </div>
      </div>
      <div class="flex flex-col gap-1">
        <label class="text-sm font-medium text-gray-700 dark:text-gray-300">Secondary color</label>
        <div class="flex items-center gap-2">
          <input type="color" name="secondary" [(ngModel)]="secondaryColor" class="h-9 w-12 rounded border border-gray-300 dark:border-gray-700 bg-transparent" />
          <input type="text" name="secondaryHex" [(ngModel)]="secondaryColor" class="flex-1 rounded-lg border border-gray-300 dark:border-gray-700 bg-transparent px-3 py-2 text-sm" />
        </div>
      </div>
    </div>

    <div class="flex flex-col gap-1">
      <label class="text-sm font-medium text-gray-700 dark:text-gray-300">Custom domain (optional)</label>
      <input type="text" name="domain" [(ngModel)]="customDomain" placeholder="app.yourbrand.com"
        class="rounded-lg border border-gray-300 dark:border-gray-700 bg-transparent px-3 py-2 text-sm" />
      <p class="text-[11px] text-gray-400">DNS + TLS for a custom domain is set up by our team — contact support after saving.</p>
    </div>

    <label class="flex items-center gap-2 text-sm text-gray-700 dark:text-gray-300">
      <input type="checkbox" name="applyChildren" [(ngModel)]="applyToChildren" />
      Apply my brand to new client workspaces automatically
    </label>
    <label class="flex items-center gap-2 text-sm text-gray-700 dark:text-gray-300">
      <input type="checkbox" name="applyExisting" [(ngModel)]="applyToExisting" />
      Also apply to all existing clients now
    </label>

    <div class="flex justify-end pt-2">
      <button type="submit" [disabled]="saving"
        class="px-5 py-2.5 rounded-xl bg-rep-lime text-rep-black text-sm font-semibold disabled:opacity-50">
        {{ saving ? 'Saving…' : 'Save branding' }}
      </button>
    </div>
  </form>
</div>
