<div class="relative min-w-0 flex-1 sm:min-w-[9.5rem]">
  <span class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">{{ label }}</span>
  <button
    #trigger
    type="button"
    (click)="toggleOpen(); $event.stopPropagation()"
    class="w-full flex items-center justify-between gap-2 px-2.5 py-2 rounded-lg border text-left text-xs font-medium transition-colors
      bg-gray-50 dark:bg-gray-900/80 border-gray-200 dark:border-gray-700 text-gray-800 dark:text-gray-200
      hover:border-rep-lime/60 dark:hover:border-rep-lime/50 focus:outline-none focus:ring-2 focus:ring-rep-lime/40">
    <span class="truncate">{{ summary() }}</span>
    <span class="flex items-center gap-1 flex-shrink-0">
      <button
        *ngIf="selected.length > 0"
        type="button"
        (click)="clear($event)"
        class="p-0.5 rounded text-gray-400 hover:text-red-500 hover:bg-red-50 dark:hover:bg-red-900/20"
        title="Clear">
        <i class="fas fa-times text-[10px]"></i>
      </button>
      <i class="fas text-[10px] text-gray-400" [class.fa-chevron-up]="open" [class.fa-chevron-down]="!open"></i>
    </span>
  </button>

  <div
    #panel
    *ngIf="open"
    class="absolute left-0 right-0 z-50 mt-1 py-1 max-h-56 overflow-y-auto rounded-lg border shadow-lg
      bg-white dark:bg-gray-900 border-gray-200 dark:border-gray-700"
    (click)="$event.stopPropagation()">
    <button
      *ngFor="let opt of options"
      type="button"
      (click)="toggleValue(opt.value, $event)"
      class="w-full flex items-center gap-2 px-2.5 py-1.5 text-left text-xs transition-colors
        hover:bg-gray-100 dark:hover:bg-gray-800 text-gray-800 dark:text-gray-200">
      <span
        class="w-3.5 h-3.5 rounded border flex items-center justify-center flex-shrink-0"
        [class.bg-rep-lime]="isSelected(opt.value)"
        [class.border-rep-lime]="isSelected(opt.value)"
        [class.border-gray-300]="!isSelected(opt.value)"
        [class.dark:border-gray-600]="!isSelected(opt.value)">
        <i *ngIf="isSelected(opt.value)" class="fas fa-check text-[8px] text-rep-black"></i>
      </span>
      <span *ngIf="opt.icon" class="flex-shrink-0">{{ opt.icon }}</span>
      <span class="truncate">{{ opt.label }}</span>
    </button>
    <div *ngIf="options.length === 0" class="px-2.5 py-2 text-xs text-gray-500">No options</div>
  </div>
</div>
