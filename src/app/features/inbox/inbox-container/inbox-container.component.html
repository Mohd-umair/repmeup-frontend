<div class="min-h-screen bg-rep-black p-6">
  <!-- Modern Header with Stats -->
  <div class="mb-6">
    <div class="flex items-center justify-between mb-6">
      <div>
        <h1 class="text-3xl font-bold text-rep-white">Unified Inbox</h1>
        <p class="text-gray-400 mt-1">
          Manage all your interactions in one place
          <span *ngIf="lastSyncTime" class="text-xs text-gray-500 ml-2">
            Last synced: {{ lastSyncTime | date:'short' }}
          </span>
        </p>
      </div>
      <div class="flex items-center gap-3">
        <!-- Auto-sync toggle -->
        <button 
          (click)="toggleAutoSync()"
          type="button"
          class="px-4 py-2 rounded-xl font-medium transition"
          [class.bg-rep-lime]="autoSyncEnabled"
          [class.text-rep-black]="autoSyncEnabled"
          [class.bg-gray-800]="!autoSyncEnabled"
          [class.text-gray-400]="!autoSyncEnabled"
          title="Toggle auto-sync (every 5 minutes)">
          <i class="fas mr-2" [class.fa-toggle-on]="autoSyncEnabled" [class.fa-toggle-off]="!autoSyncEnabled"></i>
          Auto-sync
        </button>
        
        <!-- Manual sync button -->
        <button 
          (click)="onSyncClick()"
          type="button"
          [disabled]="syncing || loading"
          class="px-6 py-3 bg-rep-lime text-rep-black font-bold rounded-xl hover:shadow-lg hover:shadow-rep-lime/50 transition disabled:opacity-50 disabled:cursor-not-allowed">
          <i class="fas mr-2" [class.fa-sync-alt]="!syncing" [class.fa-spinner]="syncing" [class.fa-spin]="syncing"></i>
          {{ syncing ? 'Syncing...' : 'Sync Now' }}
        </button>
      </div>
    </div>

    <!-- Stats Cards -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
      <div class="bg-rep-white rounded-xl p-5 border border-gray-800">
        <div class="flex items-center justify-between">
          <div>
            <p class="text-sm font-medium text-gray-600">Total Messages</p>
            <p class="text-2xl font-bold text-rep-black mt-1">{{ interactions.length }}</p>
          </div>
          <div class="w-12 h-12 bg-rep-black/10 rounded-lg flex items-center justify-center">
            <i class="fas fa-inbox text-rep-black text-xl"></i>
          </div>
        </div>
      </div>

      <div class="bg-rep-white rounded-xl p-5 border border-gray-800">
        <div class="flex items-center justify-between">
          <div>
            <p class="text-sm font-medium text-gray-600">Unread</p>
            <p class="text-2xl font-bold text-rep-black mt-1">{{ getUnreadCount() }}</p>
          </div>
          <div class="w-12 h-12 bg-gray-100 rounded-lg flex items-center justify-center">
            <i class="fas fa-envelope text-gray-600 text-xl"></i>
          </div>
        </div>
      </div>

      <div class="bg-rep-white rounded-xl p-5 border border-gray-800">
        <div class="flex items-center justify-between">
          <div>
            <p class="text-sm font-medium text-gray-600">Today</p>
            <p class="text-2xl font-bold text-rep-black mt-1">{{ getTodayCount() }}</p>
          </div>
          <div class="w-12 h-12 bg-rep-lime/20 rounded-lg flex items-center justify-center border border-rep-lime/30">
            <i class="fas fa-calendar-day text-rep-black text-xl"></i>
          </div>
        </div>
      </div>

      <div class="bg-rep-white rounded-xl p-5 border border-gray-800">
        <div class="flex items-center justify-between">
          <div>
            <p class="text-sm font-medium text-gray-600">Response Rate</p>
            <p class="text-2xl font-bold text-rep-black mt-1">94%</p>
          </div>
          <div class="w-12 h-12 bg-rep-lime/20 rounded-lg flex items-center justify-center border border-rep-lime/30">
            <i class="fas fa-chart-line text-rep-black text-xl"></i>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Top Filters Bar -->
  <div class="mb-6">
    <app-inbox-top-filters (filtersChange)="onTopFilterChange($event)"></app-inbox-top-filters>
  </div>

  <!-- Three Column Layout -->
  <div class="flex gap-6 h-[calc(100vh-350px)]">
    <!-- Left: Platform Filters -->
    <div class="w-80 bg-rep-white rounded-2xl shadow-xl overflow-hidden flex flex-col border border-gray-800">
      <div class="p-6 border-b border-gray-200 bg-gradient-to-r from-gray-50 to-white">
        <h2 class="text-lg font-bold text-rep-black flex items-center">
          <i class="fas fa-filter mr-2 text-rep-black"></i>
          Platform Filters
        </h2>
      </div>
      <div class="flex-1 overflow-y-auto">
        <app-inbox-filters (filtersChange)="onPlatformFilterChange($event)"></app-inbox-filters>
      </div>
    </div>

    <!-- Middle: Interaction List -->
    <div class="flex-1 bg-rep-white rounded-2xl shadow-xl overflow-hidden border border-gray-800">
      <div class="h-full flex flex-col">
        <div class="p-6 border-b border-gray-200 bg-gradient-to-r from-gray-50 to-white">
          <h2 class="text-lg font-bold text-rep-black flex items-center justify-between">
            <span>
              <i class="fas fa-comments mr-2"></i>
              Conversations
            </span>
            <span class="text-sm font-normal text-gray-600">{{ interactions.length }} total</span>
          </h2>
        </div>
        <div class="flex-1 overflow-hidden">
          <app-inbox-list 
            [interactions]="interactions" 
            [selectedInteraction]="selectedInteraction"
            [loading]="loading"
            (interactionSelect)="onInteractionSelect($event)"
            (searchChange)="onSearchChange($event)"
          ></app-inbox-list>
        </div>
      </div>
    </div>

    <!-- Right: Detail View -->
    <div class="flex-1 bg-rep-white rounded-2xl shadow-xl overflow-hidden border border-gray-800 min-w-0 max-w-full">
      <div class="h-full w-full overflow-x-hidden">
        <app-inbox-detail 
          [interaction]="selectedInteraction"
          (updateInteraction)="onInteractionUpdate()"
        ></app-inbox-detail>
      </div>
    </div>
  </div>
</div>
