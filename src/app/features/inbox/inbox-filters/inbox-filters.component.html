<div class="p-6">
  <!-- Header -->
  <div class="flex items-center justify-between pb-4 border-b border-gray-100 mb-6">
    <h3 class="text-sm font-bold text-rep-black uppercase tracking-wide">Platforms</h3>
    <button 
      (click)="clearPlatformFilters()"
      class="text-sm text-rep-black hover:text-rep-lime font-bold transition flex items-center"
    >
      <i class="fas fa-times-circle mr-1"></i>
      Clear
    </button>
  </div>

  <!-- Platform Filter Only -->
  <div class="space-y-2">
    <button
      *ngFor="let platform of platforms"
      (click)="toggleFilter('platform', platform.value)"
      [class]="isFilterActive('platform', platform.value) 
        ? 'bg-rep-lime/20 border-rep-lime text-rep-black shadow-md' 
        : 'bg-white border-gray-200 text-gray-700 hover:bg-gray-50 hover:border-gray-300'"
      class="w-full flex items-center justify-between px-4 py-3 border-2 rounded-xl transition-all font-medium"
    >
      <div class="flex items-center space-x-3">
        <i [class]="platform.icon + ' ' + platform.color + ' text-lg'"></i>
        <span class="text-sm font-bold">{{ platform.label }}</span>
      </div>
      <i *ngIf="isFilterActive('platform', platform.value)" class="fas fa-check-circle"></i>
    </button>
  </div>
</div>
