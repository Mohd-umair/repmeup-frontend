<div [class]="inline ? 'flex items-center gap-2 flex-wrap' : 'p-3'">
  <span *ngIf="showLabel" class="text-xs font-semibold text-gray-500 uppercase tracking-wide" [class.mr-2]="inline" [class.mb-3]="!inline" [class.block]="!inline">Platforms</span>
  <button 
    *ngIf="filters.platform"
    (click)="clearPlatformFilters()"
    class="text-xs text-gray-500 hover:text-rep-lime font-medium transition p-1 -mr-1"
    title="Clear"
  >
    <i class="fas fa-times"></i>
  </button>
  <div class="flex flex-wrap gap-1.5" [class.flex-1]="inline">
    <button
      *ngFor="let platform of platforms"
      (click)="toggleFilter('platform', platform.value)"
      [attr.title]="platform.label"
      type="button"
      class="w-9 h-9 rounded-lg flex items-center justify-center transition-all duration-200 text-sm"
      [style.background]="isFilterActive('platform', platform.value) 
        ? 'linear-gradient(135deg, ' + platform.gradientFrom + ', ' + platform.gradientTo + ')' 
        : 'rgba(0,0,0,0.04)'"
      [style.color]="isFilterActive('platform', platform.value) ? 'white' : platform.bgColor"
      [style.border]="'1px solid ' + (isFilterActive('platform', platform.value) ? platform.bgColor : 'rgba(0,0,0,0.08)')"
    >
      <i [class]="platform.icon + ' text-base'"></i>
    </button>
  </div>
</div>
