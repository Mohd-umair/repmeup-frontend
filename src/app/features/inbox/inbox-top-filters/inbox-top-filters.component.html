<div class="bg-white dark:bg-gray-900/90 rounded-xl shadow-sm p-3 sm:p-4 border border-gray-200 dark:border-gray-800">
  <!-- Toolbar: layout, title, sync actions -->
  <div class="flex items-center gap-2">
    <!-- View toggle: sliding switch between Inbox (list) and Bucket board -->
    <div
      role="tablist"
      aria-label="Switch view"
      class="relative shrink-0 grid grid-cols-2 w-[172px] p-0.5 rounded-lg bg-gray-100 dark:bg-gray-800/70 border border-gray-200 dark:border-gray-700 text-xs font-semibold select-none">
      <!-- Sliding thumb -->
      <span
        aria-hidden="true"
        class="absolute top-0.5 bottom-0.5 left-0.5 w-[calc(50%-2px)] rounded-md bg-white dark:bg-gray-900 shadow-sm ring-1 ring-black/5 dark:ring-white/10 transition-transform duration-300 ease-out"
        [class.translate-x-full]="layoutMode === 'buckets'"></span>
      <button
        type="button"
        role="tab"
        (click)="layoutChange.emit('list')"
        [attr.aria-selected]="layoutMode !== 'buckets'"
        [ngClass]="layoutMode !== 'buckets' ? 'text-rep-black dark:text-rep-lime' : 'text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-300'"
        class="relative z-10 h-8 rounded-md flex items-center justify-center gap-1.5 transition-colors duration-200"
        title="Inbox view">
        <i class="fas fa-inbox text-[13px]"></i>
        <span>Inbox</span>
      </button>
      <button
        type="button"
        role="tab"
        (click)="layoutChange.emit('buckets')"
        [attr.aria-selected]="layoutMode === 'buckets'"
        [ngClass]="layoutMode === 'buckets' ? 'text-rep-black dark:text-rep-lime' : 'text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-300'"
        class="relative z-10 h-8 rounded-md flex items-center justify-center gap-1.5 transition-colors duration-200"
        title="Bucket board view">
        <i class="fas fa-table-columns text-[13px]"></i>
        <span>Buckets</span>
      </button>
    </div>

    <!-- Always-visible conversation search (flex input-group so the clear button stays inline) -->
    <div class="flex-1 min-w-0 flex items-center gap-2 px-3 py-2 rounded-lg border bg-gray-50 dark:bg-gray-800/90 border-gray-200 dark:border-gray-700 transition-colors
      focus-within:ring-2 focus-within:ring-rep-lime/30 focus-within:border-rep-lime focus-within:bg-white dark:focus-within:bg-gray-800">
      <i class="fas fa-search text-gray-400 text-sm shrink-0"></i>
      <input
        type="text"
        [ngModel]="searchModel"
        (ngModelChange)="onSearchInput($event)"
        placeholder="Search conversations..."
        aria-label="Search conversations"
        class="flex-1 min-w-0 bg-transparent border-none outline-none text-sm text-gray-900 dark:text-gray-100 placeholder:text-gray-400" />
      <button
        *ngIf="searchModel"
        (click)="clearSearch()"
        type="button"
        class="shrink-0 flex items-center text-gray-400 hover:text-gray-600 dark:hover:text-gray-300"
        title="Clear search">
        <i class="fas fa-xmark text-sm"></i>
      </button>
    </div>

    <!-- Right controls: filter toggle, Sync All -->
    <div class="flex items-center gap-1.5 shrink-0" (click)="$event.stopPropagation()">
      <!-- Clear all filters (only when some are active) -->
      <button
        *ngIf="hasActiveFilters()"
        (click)="clearFilters()"
        type="button"
        class="h-9 px-2 rounded-lg text-xs font-medium text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors flex items-center gap-1"
        title="Clear all filters">
        <i class="fas fa-xmark text-xs"></i>
        <span class="hidden sm:inline">Clear</span>
      </button>

      <!-- Filter toggle: opens the Quick Filters panel -->
      <button
        type="button"
        (click)="toggleExpanded()"
        class="relative w-9 h-9 rounded-lg flex items-center justify-center border transition-colors"
        [class.bg-rep-lime]="expanded"
        [class.border-rep-lime]="expanded"
        [class.text-rep-black]="expanded"
        [class.border-gray-200]="!expanded"
        [class.dark:border-gray-700]="!expanded"
        [class.text-gray-500]="!expanded"
        [class.dark:text-gray-400]="!expanded"
        [class.hover:bg-gray-100]="!expanded"
        [class.dark:hover:bg-gray-800]="!expanded"
        [attr.aria-expanded]="expanded"
        [title]="expanded ? 'Hide filters' : 'Show filters'">
        <i class="fas fa-sliders-h text-sm"></i>
        <span *ngIf="hasActiveFilters()"
              class="absolute -top-0.5 -right-0.5 w-2 h-2 rounded-full bg-rep-lime ring-2 ring-white dark:ring-gray-900"></span>
      </button>

      <!-- Sync All -->
      <button
        (click)="onSyncClick($event)"
        type="button"
        [disabled]="syncDisabled"
        class="h-9 px-2.5 sm:px-3 text-xs font-semibold rounded-lg transition-all duration-300 disabled:opacity-50 text-white flex items-center gap-1.5"
        [style.background]="'linear-gradient(135deg, var(--platform-gradient-from, #4B5563), var(--platform-gradient-to, #6B7280))'"
        [title]="syncButtonTitle">
        <i class="fas text-xs" [class.fa-sync-alt]="!syncing" [class.fa-spinner]="syncing" [class.fa-spin]="syncing"></i>
        <span class="hidden md:inline">{{ syncButtonLabel }}</span>
      </button>
    </div>
  </div>

  <!-- Filters row (collapsible): Platform → Intent → Type → Status (incl. chat open/closed) → Sentiment → Labels → Extra → Date -->
  <div *ngIf="expanded" class="mt-3 animate-slideDown">
    <div class="flex flex-wrap gap-3 items-end">
      <app-inbox-multiselect-filter
        class="min-w-0 flex-1 sm:flex-initial sm:w-[11rem]"
        label="Platform"
        [options]="platformOptions"
        [selected]="selectedPlatforms"
        placeholder="Any platform"
        (selectedChange)="onPlatformsChange($event)"
      />
      <app-inbox-multiselect-filter
        *ngIf="intentBuckets && intentBuckets.length > 0"
        class="min-w-0 flex-1 sm:flex-initial sm:w-[11rem]"
        label="Intent"
        [options]="intentOptions"
        [selected]="selectedIntentBucketIds"
        placeholder="Any intent"
        (selectedChange)="onIntentChange($event)"
      />
      <app-inbox-multiselect-filter
        class="min-w-0 flex-1 sm:flex-initial sm:w-[11rem]"
        label="Type"
        [options]="typeOptions"
        [selected]="selectedTypes"
        placeholder="Any type"
        (selectedChange)="onTypesChange($event)"
      />
      <app-inbox-multiselect-filter
        class="min-w-0 flex-1 sm:flex-initial sm:w-[13rem]"
        label="Status"
        [options]="statusOptionsForMultiselect"
        [selected]="selectedStatusAndChatKeys"
        placeholder="Any status"
        (selectedChange)="onStatusAndChatChange($event)"
      />
      <app-inbox-multiselect-filter
        class="min-w-0 flex-1 sm:flex-initial sm:w-[11rem]"
        label="Sentiment"
        [options]="sentimentOptions"
        [selected]="selectedSentiments"
        placeholder="Any sentiment"
        (selectedChange)="onSentimentsChange($event)"
      />
      <app-inbox-multiselect-filter
        *ngIf="labels && labels.length > 0"
        class="min-w-0 flex-1 sm:flex-initial sm:w-[11rem]"
        label="Labels"
        [options]="labelOptions"
        [selected]="selectedLabelIds"
        placeholder="Any label"
        (selectedChange)="onLabelsChange($event)"
      />

      <!-- Extra filter: same presets as former toolbar (All, Priority, Mine, …) — not shown for bucket board -->
      <div class="min-w-0 flex-1 sm:flex-initial flex flex-col gap-1 sm:w-[11rem]">
        <span class="text-xs font-semibold text-gray-500 dark:text-gray-400 mb-1.5 tracking-wide flex items-center gap-1.5">
          <i class="fas fa-bolt text-gray-400"></i>
          Extra filter
        </span>
        <app-premium-select
          [options]="viewModeSelectOptions"
          [value]="listViewModeForDropdown"
          leadingIcon="fas fa-bolt"
          placeholder="Bucket board"
          (valueChange)="onViewModeDropdownSelect($event)">
        </app-premium-select>
      </div>

      <!-- Date range (same premium styling as the dropdowns) -->
      <div class="min-w-0 flex-1 sm:flex-initial flex flex-col gap-1">
        <span class="text-xs font-semibold text-gray-500 dark:text-gray-400 mb-1.5 tracking-wide flex items-center gap-1.5">
          <i class="fas fa-calendar-alt text-gray-400"></i>
          Date
        </span>
        <div class="flex items-center gap-1.5 flex-wrap">
          <!-- From -->
          <label
            class="flex items-center gap-2 rounded-xl border bg-white dark:bg-gray-800/70 border-gray-200 dark:border-gray-700 shadow-sm px-3 py-2.5 text-sm cursor-pointer transition-all duration-200
              hover:border-rep-lime/70 hover:shadow-md
              focus-within:ring-2 focus-within:ring-rep-lime/40 focus-within:border-rep-lime">
            <i class="fas fa-calendar-day text-gray-400 text-xs shrink-0"></i>
            <span class="text-xs font-semibold text-gray-400 dark:text-gray-500">From</span>
            <input
              type="date"
              class="text-sm text-gray-700 dark:text-gray-200 bg-transparent border-none outline-none cursor-pointer min-w-0 [color-scheme:light] dark:[color-scheme:dark]"
              [value]="dateFromModel"
              [max]="dateToModel || ''"
              (change)="onDateFromChange($any($event.target).value)"
            />
          </label>
          <span class="text-gray-400 text-sm self-center">—</span>
          <!-- To -->
          <label
            class="flex items-center gap-2 rounded-xl border bg-white dark:bg-gray-800/70 border-gray-200 dark:border-gray-700 shadow-sm px-3 py-2.5 text-sm cursor-pointer transition-all duration-200
              hover:border-rep-lime/70 hover:shadow-md
              focus-within:ring-2 focus-within:ring-rep-lime/40 focus-within:border-rep-lime">
            <i class="fas fa-calendar-day text-gray-400 text-xs shrink-0"></i>
            <span class="text-xs font-semibold text-gray-400 dark:text-gray-500">To</span>
            <input
              type="date"
              class="text-sm text-gray-700 dark:text-gray-200 bg-transparent border-none outline-none cursor-pointer min-w-0 [color-scheme:light] dark:[color-scheme:dark]"
              [value]="dateToModel"
              [min]="dateFromModel || ''"
              (change)="onDateToChange($any($event.target).value)"
            />
          </label>
          <button
            *ngIf="dateFromModel || dateToModel"
            (click)="clearDateRange(); $event.stopPropagation()"
            type="button"
            class="w-10 h-10 shrink-0 rounded-xl bg-white dark:bg-gray-800/70 border border-gray-200 dark:border-gray-700 shadow-sm hover:border-rep-lime/70 hover:shadow-md text-gray-500 flex items-center justify-center transition-all"
            title="Clear date range">
            <i class="fas fa-xmark text-sm"></i>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Applied chips: visible even when Quick Filters row is collapsed -->
  <div
    *ngIf="hasActiveFilters()"
    class="mt-2.5 pt-2 border-t border-gray-100 dark:border-gray-800 flex flex-wrap items-center gap-1"
    (click)="$event.stopPropagation()">
    <span class="text-[10px] font-semibold text-gray-400 dark:text-gray-500 uppercase tracking-wide shrink-0 mr-0.5">
      Applied
    </span>
    <span
      *ngFor="let chip of appliedFilterChips; trackBy: trackByChip"
      class="inline-flex items-center gap-0.5 max-w-full pl-1.5 pr-0.5 py-0.5 rounded-full text-[10px] font-medium leading-none
        bg-gray-100/90 dark:bg-gray-800 text-gray-700 dark:text-gray-200
        border border-gray-200/80 dark:border-gray-600">
      <span class="text-gray-500 dark:text-gray-400 shrink-0 font-normal">{{ chipCategoryLabel(chip) }}:</span>
      <span class="truncate max-w-[7.5rem] sm:max-w-[11rem]" [title]="chip.display">{{ chip.display }}</span>
      <button
        type="button"
        (click)="removeAppliedChip(chip, $event)"
        class="shrink-0 w-4 h-4 rounded-full flex items-center justify-center text-gray-400 hover:text-white hover:bg-red-500 dark:hover:bg-red-600 transition-colors"
        [attr.aria-label]="'Remove ' + chipCategoryLabel(chip) + ' ' + chip.display">
        <i class="fas fa-xmark text-[7px]"></i>
      </button>
    </span>
  </div>
</div>
