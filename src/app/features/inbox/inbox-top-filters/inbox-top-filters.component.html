<div class="bg-white dark:bg-gray-900/90 rounded-xl shadow-sm p-3 sm:p-4 border border-gray-200 dark:border-gray-800">
  <!-- Toolbar: layout, title, sync actions -->
  <div class="flex flex-wrap items-center gap-2 justify-between">
    <div class="flex items-center gap-2 min-w-0 flex-wrap">
      <div class="flex items-center gap-2 min-w-0 shrink-0">
        <h2 class="text-sm font-bold text-gray-900 dark:text-gray-100 flex items-center gap-2">
          <i
            class="text-gray-500 dark:text-gray-400"
            [class.fa-inbox]="layoutMode === 'list'"
            [class.fa-columns]="layoutMode === 'buckets'"
            [class.fas]="true"
            aria-hidden="true"></i>
          <span>{{ layoutMode === 'buckets' ? 'Bucket Board' : 'Inbox' }}</span>
        </h2>
      </div>

      <div
        (click)="toggleExpanded()"
        class="flex items-center gap-2 cursor-pointer select-none group min-w-0">
        <h3 class="text-sm font-semibold text-gray-900 dark:text-gray-100 flex items-center gap-2 group-hover:text-gray-700 dark:group-hover:text-gray-200">
          <i class="fas fa-sliders-h text-gray-400"></i>
          <span>Quick Filters</span>
        </h3>
      </div>
    </div>

    <div class="flex items-center gap-1.5 shrink-0 flex-wrap ml-auto" (click)="$event.stopPropagation()">
      <button
        (click)="onAutoSyncClick($event)"
        type="button"
        class="px-2.5 sm:px-3 py-1.5 rounded-lg text-xs font-medium transition-all duration-300 flex items-center gap-1.5"
        [style.background]="autoSyncEnabled ? 'linear-gradient(135deg, var(--platform-gradient-from, #4B5563), var(--platform-gradient-to, #6B7280))' : 'rgba(75, 85, 99, 0.2)'"
        [class.text-white]="autoSyncEnabled"
        [class.text-gray-600]="!autoSyncEnabled"
        [class.dark:text-gray-300]="!autoSyncEnabled"
        [class.hover:bg-gray-100]="!autoSyncEnabled"
        [class.dark:hover:bg-gray-800]="!autoSyncEnabled"
        [attr.aria-pressed]="autoSyncEnabled"
        [title]="autoSyncEnabled ? 'Auto-sync ON – syncing every 5 min' : 'Auto-sync OFF – click to enable'">
        <i class="fas" [class.fa-toggle-on]="autoSyncEnabled" [class.fa-toggle-off]="!autoSyncEnabled"></i>
        <span class="hidden md:inline">{{ autoSyncEnabled ? 'Auto-sync ON' : 'Auto-sync OFF' }}</span>
      </button>

      <button
        (click)="onSyncClick($event)"
        type="button"
        [disabled]="syncDisabled"
        class="px-2.5 sm:px-3 py-1.5 text-xs font-semibold rounded-lg transition-all duration-300 disabled:opacity-50 text-white flex items-center gap-1.5"
        [style.background]="'linear-gradient(135deg, var(--platform-gradient-from, #4B5563), var(--platform-gradient-to, #6B7280))'"
        [title]="syncButtonTitle">
        <i class="fas text-xs" [class.fa-sync-alt]="!syncing" [class.fa-spinner]="syncing" [class.fa-spin]="syncing"></i>
        <span class="hidden md:inline">{{ syncButtonLabel }}</span>
      </button>

      <button
        *ngIf="hasActiveFilters()"
        (click)="clearFilters(); $event.stopPropagation()"
        (touchstart)="clearFilters(); $event.stopPropagation()"
        type="button"
        class="touch-manipulation flex items-center gap-1.5 px-2.5 py-1.5 bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-200 rounded-lg transition-colors text-xs font-medium"
        title="Clear all filters">
        <i class="fas fa-xmark text-xs"></i>
        Clear
      </button>

      <button
        type="button"
        (click)="toggleExpanded()"
        class="w-8 h-8 rounded-lg flex items-center justify-center text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors"
        [attr.aria-expanded]="expanded"
        [title]="expanded ? 'Collapse filters' : 'Expand filters'">
        <i class="fas transition-transform duration-200 text-sm"
           [class.fa-chevron-down]="expanded"
           [class.fa-chevron-right]="!expanded"></i>
      </button>
    </div>
  </div>

  <!-- Filters row (collapsible): Platform → Intent → Type → Status (incl. chat open/closed) → Sentiment → Labels → Extra → Date -->
  <div *ngIf="expanded" class="mt-3 animate-slideDown">
    <div class="flex flex-wrap gap-3 items-end">
      <app-inbox-multiselect-filter
        class="min-w-0 flex-1 sm:flex-initial sm:w-[11rem]"
        label="Platform"
        [options]="platformOptions"
        [selected]="selectedPlatforms"
        placeholder="Any platform"
        (selectedChange)="onPlatformsChange($event)"
      />
      <app-inbox-multiselect-filter
        *ngIf="intentBuckets && intentBuckets.length > 0"
        class="min-w-0 flex-1 sm:flex-initial sm:w-[11rem]"
        label="Intent"
        [options]="intentOptions"
        [selected]="selectedIntentBucketIds"
        placeholder="Any intent"
        (selectedChange)="onIntentChange($event)"
      />
      <app-inbox-multiselect-filter
        class="min-w-0 flex-1 sm:flex-initial sm:w-[11rem]"
        label="Type"
        [options]="typeOptions"
        [selected]="selectedTypes"
        placeholder="Any type"
        (selectedChange)="onTypesChange($event)"
      />
      <app-inbox-multiselect-filter
        class="min-w-0 flex-1 sm:flex-initial sm:w-[13rem]"
        label="Status"
        [options]="statusOptionsForMultiselect"
        [selected]="selectedStatusAndChatKeys"
        placeholder="Any status"
        (selectedChange)="onStatusAndChatChange($event)"
      />
      <app-inbox-multiselect-filter
        class="min-w-0 flex-1 sm:flex-initial sm:w-[11rem]"
        label="Sentiment"
        [options]="sentimentOptions"
        [selected]="selectedSentiments"
        placeholder="Any sentiment"
        (selectedChange)="onSentimentsChange($event)"
      />
      <app-inbox-multiselect-filter
        *ngIf="labels && labels.length > 0"
        class="min-w-0 flex-1 sm:flex-initial sm:w-[11rem]"
        label="Labels"
        [options]="labelOptions"
        [selected]="selectedLabelIds"
        placeholder="Any label"
        (selectedChange)="onLabelsChange($event)"
      />

      <!-- Extra filter: same presets as former toolbar (All, Priority, Mine, …) — not shown for bucket board -->
      <div class="min-w-0 flex-1 sm:flex-initial flex flex-col gap-1 sm:w-[11rem]">
        <span class="text-xs font-medium text-gray-500 dark:text-gray-400 flex items-center gap-1">
          <i class="fas fa-bolt text-gray-400"></i>
          Extra filter
        </span>
        <select
          class="w-full text-xs font-medium rounded-lg border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800/80 text-gray-800 dark:text-gray-100 px-2.5 py-2 outline-none focus:ring-2 focus:ring-rep-lime/40 cursor-pointer"
          [ngModel]="listViewModeForDropdown"
          (ngModelChange)="onViewModeDropdownSelect($event)"
          (click)="$event.stopPropagation()"
        >
          <option *ngIf="layoutMode === 'buckets'" value="" disabled>Bucket board</option>
          <option value="all">All</option>
          <option value="priority">Priority</option>
          <option value="assigned">Mine</option>
          <option value="needs_response">Pending</option>
          <option value="overdue">Overdue</option>
          <option value="archived">Archived</option>
        </select>
      </div>

      <!-- Date range (same row, label aligned with other filters) -->
      <div class="min-w-0 flex-1 sm:flex-initial flex flex-col gap-1">
        <span class="text-xs font-medium text-gray-500 dark:text-gray-400 flex items-center gap-1">
          <i class="fas fa-calendar-alt text-gray-400"></i>
          Date
        </span>
        <div class="flex items-center gap-1.5 flex-wrap">
          <div class="flex items-center gap-1 bg-gray-50 dark:bg-gray-800/80 border border-gray-200 dark:border-gray-700 rounded-lg px-2 py-2">
            <span class="text-xs text-gray-400">From</span>
            <input
              type="date"
              class="text-xs text-gray-700 dark:text-gray-200 bg-transparent border-none outline-none cursor-pointer min-w-0"
              [value]="dateFromModel"
              [max]="dateToModel || ''"
              (change)="onDateFromChange($any($event.target).value)"
            />
          </div>
          <span class="text-gray-400 text-xs self-center">—</span>
          <div class="flex items-center gap-1 bg-gray-50 dark:bg-gray-800/80 border border-gray-200 dark:border-gray-700 rounded-lg px-2 py-2">
            <span class="text-xs text-gray-400">To</span>
            <input
              type="date"
              class="text-xs text-gray-700 dark:text-gray-200 bg-transparent border-none outline-none cursor-pointer min-w-0"
              [value]="dateToModel"
              [min]="dateFromModel || ''"
              (change)="onDateToChange($any($event.target).value)"
            />
          </div>
          <button
            *ngIf="dateFromModel || dateToModel"
            (click)="clearDateRange(); $event.stopPropagation()"
            type="button"
            class="w-8 h-8 shrink-0 rounded-lg bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-500 flex items-center justify-center transition-colors"
            title="Clear date range">
            <i class="fas fa-xmark text-xs"></i>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Applied chips: visible even when Quick Filters row is collapsed -->
  <div
    *ngIf="hasActiveFilters()"
    class="mt-2.5 pt-2 border-t border-gray-100 dark:border-gray-800 flex flex-wrap items-center gap-1"
    (click)="$event.stopPropagation()">
    <span class="text-[10px] font-semibold text-gray-400 dark:text-gray-500 uppercase tracking-wide shrink-0 mr-0.5">
      Applied
    </span>
    <span
      *ngFor="let chip of appliedFilterChips; trackBy: trackByChip"
      class="inline-flex items-center gap-0.5 max-w-full pl-1.5 pr-0.5 py-0.5 rounded-full text-[10px] font-medium leading-none
        bg-gray-100/90 dark:bg-gray-800 text-gray-700 dark:text-gray-200
        border border-gray-200/80 dark:border-gray-600">
      <span class="text-gray-500 dark:text-gray-400 shrink-0 font-normal">{{ chipCategoryLabel(chip) }}:</span>
      <span class="truncate max-w-[7.5rem] sm:max-w-[11rem]" [title]="chip.display">{{ chip.display }}</span>
      <button
        type="button"
        (click)="removeAppliedChip(chip, $event)"
        class="shrink-0 w-4 h-4 rounded-full flex items-center justify-center text-gray-400 hover:text-white hover:bg-red-500 dark:hover:bg-red-600 transition-colors"
        [attr.aria-label]="'Remove ' + chipCategoryLabel(chip) + ' ' + chip.display">
        <i class="fas fa-xmark text-[7px]"></i>
      </button>
    </span>
  </div>
</div>
