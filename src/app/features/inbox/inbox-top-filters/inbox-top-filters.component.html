<div class="bg-white dark:bg-gray-900/90 rounded-xl shadow-sm p-4 border border-gray-200 dark:border-gray-800">
  <!-- Header (clickable to collapse/expand) -->
  <div
    (click)="toggleExpanded()"
    class="flex items-center justify-between cursor-pointer select-none group"
  >
    <h3 class="text-sm font-semibold text-gray-900 dark:text-gray-100 flex items-center gap-2 group-hover:text-gray-700 dark:group-hover:text-gray-200">
      <i class="fas fa-sliders-h text-gray-400"></i>
      <span>Quick Filters</span>
    </h3>
    <div class="flex items-center gap-2">
      <button
        *ngIf="hasActiveFilters() && expanded"
        (click)="clearFilters(); $event.stopPropagation()"
        (touchstart)="clearFilters(); $event.stopPropagation()"
        type="button"
        class="touch-manipulation flex items-center gap-1.5 px-2.5 py-1 bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-200 rounded-lg transition-colors text-xs font-medium"
        title="Clear all filters"
      >
        <i class="fas fa-times text-xs"></i>
        Clear
      </button>
      <i class="fas transition-transform duration-200 text-gray-400 text-sm"
         [class.fa-chevron-down]="expanded"
         [class.fa-chevron-right]="!expanded"
         [class.rotate-0]="expanded"
         title="{{ expanded ? 'Collapse' : 'Expand' }}"></i>
    </div>
  </div>

  <!-- Filters row (collapsible) — multiselects + date on one row -->
  <div *ngIf="expanded" class="mt-3 animate-slideDown">
    <div class="flex flex-wrap gap-3 items-end">
      <app-inbox-multiselect-filter
        *ngIf="labels && labels.length > 0"
        class="min-w-0 flex-1 sm:flex-initial sm:w-[11rem]"
        label="Labels"
        [options]="labelOptions"
        [selected]="selectedLabelIds"
        placeholder="Any label"
        (selectedChange)="onLabelsChange($event)"
      />
      <app-inbox-multiselect-filter
        class="min-w-0 flex-1 sm:flex-initial sm:w-[11rem]"
        label="Type"
        [options]="typeOptions"
        [selected]="selectedTypes"
        placeholder="Any type"
        (selectedChange)="onTypesChange($event)"
      />
      <app-inbox-multiselect-filter
        class="min-w-0 flex-1 sm:flex-initial sm:w-[11rem]"
        label="Sentiment"
        [options]="sentimentOptions"
        [selected]="selectedSentiments"
        placeholder="Any sentiment"
        (selectedChange)="onSentimentsChange($event)"
      />
      <app-inbox-multiselect-filter
        class="min-w-0 flex-1 sm:flex-initial sm:w-[11rem]"
        label="Status"
        [options]="statusOptions"
        [selected]="selectedStatuses"
        placeholder="Any status"
        (selectedChange)="onStatusesChange($event)"
      />

      <!-- Chat session: open vs closed conversations -->
      <div class="min-w-0 flex-1 sm:flex-initial flex flex-col gap-1">
        <span class="text-xs font-medium text-gray-500 dark:text-gray-400 flex items-center gap-1">
          <i class="fas fa-comment-dots text-gray-400"></i>
          Chat
        </span>
        <div
          class="inline-flex rounded-lg border border-gray-200 dark:border-gray-700 overflow-hidden bg-gray-50 dark:bg-gray-800/80"
          role="group"
          aria-label="Filter by chat session"
        >
          <button
            type="button"
            (click)="onChatSessionChange(null); $event.stopPropagation()"
            class="px-2.5 py-2 text-[11px] font-semibold transition-colors min-w-[2.5rem]"
            [class.bg-rep-lime]="chatSession === null"
            [class.text-rep-black]="chatSession === null"
            [class.text-gray-600]="chatSession !== null"
            [class.dark:text-gray-300]="chatSession !== null"
          >
            All
          </button>
          <button
            type="button"
            (click)="onChatSessionChange('open')"
            class="px-2.5 py-2 text-[11px] font-semibold border-l border-gray-200 dark:border-gray-700 transition-colors"
            [class.bg-emerald-500]="chatSession === 'open'"
            [class.text-white]="chatSession === 'open'"
            [class.text-gray-600]="chatSession !== 'open'"
            [class.dark:text-gray-300]="chatSession !== 'open'"
          >
            Open
          </button>
          <button
            type="button"
            (click)="onChatSessionChange('closed'); $event.stopPropagation()"
            class="px-2.5 py-2 text-[11px] font-semibold border-l border-gray-200 dark:border-gray-700 transition-colors"
            [class.bg-gray-600]="chatSession === 'closed'"
            [class.text-white]="chatSession === 'closed'"
            [class.text-gray-600]="chatSession !== 'closed'"
            [class.dark:text-gray-300]="chatSession !== 'closed'"
          >
            Closed
          </button>
        </div>
      </div>

      <!-- Date range (same row, label aligned with other filters) -->
      <div class="min-w-0 flex-1 sm:flex-initial flex flex-col gap-1">
        <span class="text-xs font-medium text-gray-500 dark:text-gray-400 flex items-center gap-1">
          <i class="fas fa-calendar-alt text-gray-400"></i>
          Date
        </span>
        <div class="flex items-center gap-1.5 flex-wrap">
          <div class="flex items-center gap-1 bg-gray-50 dark:bg-gray-800/80 border border-gray-200 dark:border-gray-700 rounded-lg px-2 py-2">
            <span class="text-xs text-gray-400">From</span>
            <input
              type="date"
              class="text-xs text-gray-700 dark:text-gray-200 bg-transparent border-none outline-none cursor-pointer min-w-0"
              [value]="dateFromModel"
              [max]="dateToModel || ''"
              (change)="onDateFromChange($any($event.target).value)"
            />
          </div>
          <span class="text-gray-400 text-xs self-center">—</span>
          <div class="flex items-center gap-1 bg-gray-50 dark:bg-gray-800/80 border border-gray-200 dark:border-gray-700 rounded-lg px-2 py-2">
            <span class="text-xs text-gray-400">To</span>
            <input
              type="date"
              class="text-xs text-gray-700 dark:text-gray-200 bg-transparent border-none outline-none cursor-pointer min-w-0"
              [value]="dateToModel"
              [min]="dateFromModel || ''"
              (change)="onDateToChange($any($event.target).value)"
            />
          </div>
          <button
            *ngIf="dateFromModel || dateToModel"
            (click)="clearDateRange(); $event.stopPropagation()"
            type="button"
            class="w-8 h-8 shrink-0 rounded-lg bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-500 flex items-center justify-center transition-colors"
            title="Clear date range">
            <i class="fas fa-times text-xs"></i>
          </button>
        </div>
      </div>
    </div>

    <!-- Small applied-filter badges (directly under filter controls) -->
    <div
      *ngIf="hasActiveFilters()"
      class="mt-2.5 pt-2 border-t border-gray-100 dark:border-gray-800 flex flex-wrap items-center gap-1"
      (click)="$event.stopPropagation()">
      <span class="text-[10px] font-semibold text-gray-400 dark:text-gray-500 uppercase tracking-wide shrink-0 mr-0.5">
        Applied
      </span>
      <span
        *ngFor="let chip of appliedFilterChips; trackBy: trackByChip"
        class="inline-flex items-center gap-0.5 max-w-full pl-1.5 pr-0.5 py-0.5 rounded-full text-[10px] font-medium leading-none
          bg-gray-100/90 dark:bg-gray-800 text-gray-700 dark:text-gray-200
          border border-gray-200/80 dark:border-gray-600">
        <span class="text-gray-500 dark:text-gray-400 shrink-0 font-normal">{{ chipCategoryLabel(chip) }}:</span>
        <span class="truncate max-w-[7.5rem] sm:max-w-[11rem]" [title]="chip.display">{{ chip.display }}</span>
        <button
          type="button"
          (click)="removeAppliedChip(chip, $event)"
          class="shrink-0 w-4 h-4 rounded-full flex items-center justify-center text-gray-400 hover:text-white hover:bg-red-500 dark:hover:bg-red-600 transition-colors"
          [attr.aria-label]="'Remove ' + chipCategoryLabel(chip) + ' ' + chip.display">
          <i class="fas fa-times text-[7px]"></i>
        </button>
      </span>
    </div>
  </div>
</div>
