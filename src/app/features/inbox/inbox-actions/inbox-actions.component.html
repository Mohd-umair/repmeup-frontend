<div class="h-full flex flex-col overflow-hidden">
  <!-- Empty state -->
  <div *ngIf="!interaction" class="flex-1 flex items-center justify-center p-6 text-center">
    <div class="text-gray-500 dark:text-gray-400 text-sm">
      <i class="fas fa-mouse-pointer text-2xl mb-3 block opacity-50"></i>
      Select a conversation to see actions
    </div>
  </div>

  <div *ngIf="interaction" class="flex-1 overflow-y-auto p-4 space-y-4">
    

    <!-- Assign to agent -->
    <div *ngIf="canAssign()" class="space-y-2">
      <label class="text-xs font-semibold text-gray-500 uppercase">Assign</label>
      <div *ngIf="isAssigned()" class="flex items-center justify-between gap-2 bg-gray-50 rounded-lg px-2.5 py-1.5 border border-gray-200">
        <span class="text-xs font-medium text-gray-900 truncate">{{ getAssignedAgentName() }}</span>
      </div>
      <select
        *ngIf="!loadingAgents && availableAgents.length > 0"
        (change)="onAssign($any($event.target).value); $any($event.target).value = ''"
        [disabled]="assigningAgent"
        class="w-full px-2.5 py-1.5 border rounded-lg text-xs focus:ring-2 focus:ring-rep-lime/20 focus:border-rep-lime transition"
        style="border-color: rgba(0,0,0,0.15);"
      >
        <option value="">{{ isAssigned() ? 'Reassign...' : 'Select agent...' }}</option>
        <option *ngFor="let agent of availableAgents" [value]="agent._id">
          {{ agent.firstName }} {{ agent.lastName }}
        </option>
      </select>
      <span *ngIf="loadingAgents" class="text-xs text-gray-500 dark:text-gray-400">Loading...</span>
    </div>

    <!-- Status -->
    <div class="space-y-2">
      <label class="text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase">Status</label>

      <!-- Current status badge -->
      <div *ngIf="interaction?.status" class="flex items-center gap-2 bg-gray-50 dark:bg-gray-800 rounded-lg px-2.5 py-1.5 border border-gray-200 dark:border-gray-700">
        <i class="fas text-[11px]"
          [class]="getCurrentStatusOption()?.icon ?? 'fa-circle'"
          [ngClass]="getCurrentStatusOption()?.colorClass ?? 'text-gray-400'"></i>
        <span class="text-xs font-medium text-gray-800 dark:text-gray-200">{{ getCurrentStatusOption()?.label ?? interaction?.status }}</span>
        <span *ngIf="updatingStatus" class="ml-auto">
          <i class="fas fa-spinner fa-spin text-gray-400 text-[10px]"></i>
        </span>
      </div>

      <!-- Change status select -->
      <select
        (change)="onStatusChange($any($event.target).value); $any($event.target).value = ''"
        [disabled]="updatingStatus"
        class="w-full px-2.5 py-1.5 border rounded-lg text-xs focus:ring-2 focus:ring-rep-lime/20 focus:border-rep-lime transition dark:bg-gray-800 dark:text-gray-200 dark:border-gray-600 disabled:opacity-50 disabled:cursor-not-allowed"
        style="border-color: rgba(0,0,0,0.15);"
      >
        <option value="">Change status...</option>
        <option
          *ngFor="let opt of statusOptions"
          [value]="opt.value"
          [disabled]="interaction?.status === opt.value"
        >
          {{ opt.label }}{{ interaction?.status === opt.value ? ' ✓' : '' }}
        </option>
      </select>
    </div>

    <!-- Labels -->
    <div class="space-y-2">
      <label class="text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase">Labels</label>
      <div *ngIf="leadLabel && !hasLabel(leadLabel._id)" class="mb-1.5">
        <button
          (click)="onMarkAsLead()"
          [disabled]="addingLabel"
          type="button"
          class="w-full px-3 py-2 rounded-lg text-xs font-medium bg-amber-100 text-amber-800 hover:bg-amber-200 transition flex items-center justify-center gap-2"
        >
          <i *ngIf="addingLabel" class="fas fa-spinner fa-spin"></i>
          <i *ngIf="!addingLabel" class="fas fa-star"></i>
          Mark as lead
        </button>
      </div>
      <select
        *ngIf="!loadingLabels && orgLabels.length > 0"
        (change)="onAddLabel($any($event.target).value); $any($event.target).value = ''"
        [disabled]="addingLabel"
        class="w-full px-2.5 py-1.5 border rounded-lg text-xs focus:ring-2 focus:ring-rep-lime/20 focus:border-rep-lime transition"
        style="border-color: rgba(0,0,0,0.15);"
      >
        <option value="">Add label...</option>
        <option *ngFor="let l of orgLabels" [value]="l._id" [disabled]="hasLabel(l._id)">
          {{ l.name }}{{ hasLabel(l._id) ? ' ✓' : '' }}
        </option>
      </select>
      <span *ngIf="loadingLabels" class="text-xs text-gray-500 dark:text-gray-400">Loading labels...</span>
      <span *ngIf="!loadingLabels && orgLabels.length === 0" class="text-xs text-gray-500 dark:text-gray-400">No labels yet</span>
    </div>

    <!-- Add note -->
    <div class="space-y-2">
      <label class="text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase">Add note</label>
      <textarea
        [(ngModel)]="noteText"
        placeholder="Internal note (team only)..."
        rows="3"
        class="w-full px-2.5 py-2 border rounded-lg text-xs resize-none focus:ring-2 focus:ring-rep-lime/20 focus:border-rep-lime transition"
        style="border-color: rgba(0,0,0,0.15);"
      ></textarea>
      <div class="flex items-center justify-between gap-2">
        <label class="flex items-center gap-1.5 text-xs text-gray-600 dark:text-gray-400 cursor-pointer">
          <input type="checkbox" [(ngModel)]="noteIsPrivate" class="rounded">
          Private
        </label>
        <button
          (click)="onAddNote()"
          [disabled]="addingNote || !noteText?.trim()"
          type="button"
          class="px-3 py-1.5 bg-rep-lime hover:bg-rep-lime/90 text-rep-black rounded-lg text-xs font-bold transition disabled:opacity-50 disabled:cursor-not-allowed"
        >
          <i *ngIf="addingNote" class="fas fa-spinner fa-spin mr-1"></i>
          Add
        </button>
      </div>
    </div>
  </div>
</div>
