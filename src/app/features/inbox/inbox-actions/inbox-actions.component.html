<div class="h-full flex flex-col overflow-hidden">
  <!-- Empty state -->
  <div *ngIf="!interaction" class="flex-1 flex items-center justify-center p-6 text-center">
    <div class="text-gray-500 dark:text-gray-400 text-base">
      <i class="fas fa-bolt text-3xl mb-3 block opacity-50"></i>
      Select a conversation to see actions
    </div>
  </div>

  <div *ngIf="interaction" class="flex-1 overflow-y-auto p-4 space-y-3.5 text-sm">

    <!-- Assign to agent -->
    <section *ngIf="canAssign()"
             class="rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800/40 p-3.5 space-y-2.5">
      <div class="flex items-center gap-2.5">
        <span class="w-8 h-8 rounded-lg bg-blue-50 dark:bg-blue-950/40 text-blue-500 dark:text-blue-300 flex items-center justify-center shrink-0">
          <i class="fas fa-user-plus text-sm"></i>
        </span>
        <h4 class="text-sm font-bold text-gray-800 dark:text-gray-100">Assign</h4>
      </div>

      <div *ngIf="isAssigned()"
           class="flex items-center gap-2 rounded-lg bg-gray-50 dark:bg-gray-800 px-3 py-2 border border-gray-200 dark:border-gray-700">
        <i class="fas fa-user-check text-emerald-500 text-sm shrink-0"></i>
        <span class="text-sm font-medium text-gray-900 dark:text-gray-100 truncate">{{ getAssignedAgentName() }}</span>
      </div>

      <app-premium-select
        *ngIf="!loadingAgents && availableAgents.length > 0"
        size="lg"
        [options]="agentSelectOptions"
        [value]="''"
        [disabled]="assigningAgent"
        leadingIcon="fas fa-user-group"
        [placeholder]="isAssigned() ? 'Reassign to…' : 'Select agent…'"
        (valueChange)="onAssign($event)">
      </app-premium-select>
      <span *ngIf="loadingAgents" class="text-sm text-gray-500 dark:text-gray-400">Loading…</span>
    </section>

    <!-- Status -->
    <section class="rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800/40 p-3.5 space-y-2.5">
      <div class="flex items-center gap-2.5">
        <span class="w-8 h-8 rounded-lg bg-amber-50 dark:bg-amber-950/40 text-amber-500 dark:text-amber-300 flex items-center justify-center shrink-0">
          <i class="fas fa-flag text-sm"></i>
        </span>
        <h4 class="text-sm font-bold text-gray-800 dark:text-gray-100">Status</h4>
      </div>

      <!-- Current status badge -->
      <div *ngIf="interaction?.status"
           class="flex items-center gap-2 rounded-lg bg-gray-50 dark:bg-gray-800 px-3 py-2 border border-gray-200 dark:border-gray-700">
        <i class="fas text-sm"
          [class]="getCurrentStatusOption()?.icon ?? 'fa-circle'"
          [ngClass]="getCurrentStatusOption()?.colorClass ?? 'text-gray-400'"></i>
        <span class="text-sm font-medium text-gray-800 dark:text-gray-200">{{ getCurrentStatusOption()?.label ?? interaction?.status }}</span>
        <span *ngIf="updatingStatus" class="ml-auto">
          <i class="fas fa-spinner fa-spin text-gray-400 text-xs"></i>
        </span>
      </div>

      <!-- Change status -->
      <app-premium-select
        size="lg"
        [options]="statusSelectOptions"
        [value]="''"
        [disabled]="updatingStatus"
        leadingIcon="fas fa-arrows-rotate"
        placeholder="Change status…"
        (valueChange)="onStatusChange($event)">
      </app-premium-select>
    </section>

    <!-- Labels -->
    <section class="rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800/40 p-3.5 space-y-2.5">
      <div class="flex items-center gap-2.5">
        <span class="w-8 h-8 rounded-lg bg-purple-50 dark:bg-purple-950/40 text-purple-500 dark:text-purple-300 flex items-center justify-center shrink-0">
          <i class="fas fa-tag text-sm"></i>
        </span>
        <h4 class="text-sm font-bold text-gray-800 dark:text-gray-100">Labels</h4>
      </div>

      <!-- Applied labels -->
      <div *ngIf="interaction?.labels?.length" class="flex flex-wrap gap-1.5">
        <span *ngFor="let l of interaction.labels"
              class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-semibold"
              [style.background-color]="(l.color || '#6B7280') + '22'"
              [style.color]="l.color || '#6B7280'">
          <i class="fas fa-tag text-[10px]"></i>{{ l.name }}
        </span>
      </div>

      <!-- Mark as lead quick action -->
      <button
        *ngIf="leadLabel && !hasLabel(leadLabel._id)"
        (click)="onMarkAsLead()"
        [disabled]="addingLabel"
        type="button"
        class="w-full px-3 py-2.5 rounded-lg text-sm font-semibold bg-amber-100 dark:bg-amber-900/30 text-amber-800 dark:text-amber-300 hover:bg-amber-200 dark:hover:bg-amber-900/50 transition flex items-center justify-center gap-2 disabled:opacity-50"
      >
        <i *ngIf="addingLabel" class="fas fa-spinner fa-spin"></i>
        <i *ngIf="!addingLabel" class="fas fa-star"></i>
        Mark as lead
      </button>

      <app-premium-select
        *ngIf="!loadingLabels && orgLabels.length > 0"
        size="lg"
        [options]="labelSelectOptions"
        [value]="''"
        [disabled]="addingLabel"
        leadingIcon="fas fa-tags"
        placeholder="Add label…"
        (valueChange)="onAddLabel($event)">
      </app-premium-select>
      <span *ngIf="loadingLabels" class="text-sm text-gray-500 dark:text-gray-400">Loading labels…</span>
      <span *ngIf="!loadingLabels && orgLabels.length === 0" class="text-sm text-gray-500 dark:text-gray-400">No labels yet</span>
    </section>

    <!-- Add note -->
    <section class="rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800/40 p-3.5 space-y-2.5">
      <div class="flex items-center gap-2.5">
        <span class="w-8 h-8 rounded-lg bg-gray-100 dark:bg-gray-700/60 text-gray-500 dark:text-gray-300 flex items-center justify-center shrink-0">
          <i class="fas fa-note-sticky text-sm"></i>
        </span>
        <h4 class="text-sm font-bold text-gray-800 dark:text-gray-100">Add note</h4>
      </div>

      <textarea
        [(ngModel)]="noteText"
        placeholder="Internal note (team only)…"
        rows="3"
        class="w-full px-3 py-2.5 rounded-lg text-sm resize-none border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-rep-lime/25 focus:border-rep-lime transition"
      ></textarea>
      <div class="flex items-center justify-between gap-2">
        <label class="flex items-center gap-2 text-sm text-gray-600 dark:text-gray-300 cursor-pointer select-none">
          <input type="checkbox" [(ngModel)]="noteIsPrivate" class="w-4 h-4 rounded accent-rep-lime">
          Private
        </label>
        <button
          (click)="onAddNote()"
          [disabled]="addingNote || !noteText?.trim()"
          type="button"
          class="px-4 py-2 bg-rep-lime hover:bg-rep-lime/90 text-rep-black rounded-lg text-sm font-bold transition disabled:opacity-50 disabled:cursor-not-allowed inline-flex items-center gap-1.5"
        >
          <i *ngIf="addingNote" class="fas fa-spinner fa-spin"></i>
          <i *ngIf="!addingNote" class="fas fa-plus text-xs"></i>
          Add note
        </button>
      </div>
    </section>
  </div>
</div>
