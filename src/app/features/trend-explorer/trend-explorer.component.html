<div class="min-h-screen bg-rep-black p-4 md:p-6">
  <div class="mb-6">
    <h1 class="text-2xl md:text-3xl font-bold text-rep-white flex items-center gap-2">
      <i class="fas fa-chart-line text-rep-lime"></i>
      Trend Explorer
    </h1>
    <p class="text-gray-400 mt-1">Discover trends, memes, and holidays to fuel your content.</p>
  </div>

  <!-- Search -->
  <div class="mb-8 flex gap-2">
    <input
      type="text"
      [(ngModel)]="searchQuery"
      (keydown.enter)="search()"
      placeholder="Search trends..."
      class="flex-1 max-w-md px-4 py-2 bg-gray-800 border border-gray-700 text-white rounded-lg focus:ring-2 focus:ring-rep-lime"
    />
    <button type="button" (click)="search()" class="px-4 py-2 bg-rep-lime text-rep-black rounded-lg font-semibold">Search</button>
  </div>

  <!-- Trending Today -->
  <section class="mb-10">
    <h2 class="text-xl font-bold text-rep-white mb-4 flex items-center gap-2">
      <i class="fas fa-fire text-amber-500"></i>
      Trending Today
    </h2>
    <div *ngIf="loadingTrending" class="flex justify-center py-8">
      <i class="fas fa-spinner fa-spin text-2xl text-gray-400"></i>
    </div>
    <div *ngIf="!loadingTrending && trending.length === 0" class="text-gray-500 py-4">No trends found.</div>
    <div *ngIf="!loadingTrending && trending.length > 0" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
      <app-trend-card *ngFor="let t of trending" [trend]="t" (generate)="onGenerate(t)"></app-trend-card>
    </div>
  </section>

  <!-- Meme Templates -->
  <section class="mb-10">
    <h2 class="text-xl font-bold text-rep-white mb-4 flex items-center gap-2">
      <i class="fas fa-smile text-purple-400"></i>
      Meme Templates
    </h2>
    <div *ngIf="loadingMemes" class="flex justify-center py-8">
      <i class="fas fa-spinner fa-spin text-2xl text-gray-400"></i>
    </div>
    <div *ngIf="!loadingMemes && memes.length > 0" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
      <div
        *ngFor="let m of memes"
        class="rounded-xl border border-gray-800 bg-gray-900/50 p-4 hover:border-gray-700 transition"
      >
        <h3 class="text-sm font-semibold text-white mb-1">{{ m.title }}</h3>
        <p *ngIf="m.suggestedAngle" class="text-xs text-gray-400 mb-3">{{ m.suggestedAngle }}</p>
        <button
          type="button"
          (click)="onGenerateMeme(m)"
          class="px-3 py-1.5 bg-rep-lime text-rep-black rounded-lg text-sm font-semibold hover:shadow-lg transition"
        >
          Generate Post
        </button>
      </div>
    </div>
  </section>

  <!-- Holiday Calendar -->
  <section class="mb-10">
    <h2 class="text-xl font-bold text-rep-white mb-4 flex items-center gap-2">
      <i class="fas fa-calendar-alt text-blue-400"></i>
      Holiday Calendar
    </h2>
    <div *ngIf="loadingHolidays" class="flex justify-center py-8">
      <i class="fas fa-spinner fa-spin text-2xl text-gray-400"></i>
    </div>
    <div *ngIf="!loadingHolidays && holidays.length > 0" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
      <div
        *ngFor="let h of holidays"
        class="rounded-xl border border-gray-800 bg-gray-900/50 p-4 hover:border-gray-700 transition"
      >
        <div class="flex items-center justify-between mb-2">
          <span class="text-sm font-semibold text-white">{{ h.name }}</span>
          <span class="text-xs text-gray-500">{{ h.date }}</span>
        </div>
        <button
          type="button"
          (click)="onGenerateHoliday(h)"
          class="px-3 py-1.5 bg-rep-lime text-rep-black rounded-lg text-sm font-semibold hover:shadow-lg transition"
        >
          Generate Post
        </button>
      </div>
    </div>
  </section>
</div>
