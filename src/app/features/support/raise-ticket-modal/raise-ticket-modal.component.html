<!-- Backdrop -->
<div class="fixed inset-0 z-50 flex items-center justify-center p-4"
     (click)="close()" aria-modal="true" role="dialog" aria-labelledby="ticket-modal-title">
  <div class="absolute inset-0 bg-black/50 backdrop-blur-sm"></div>

  <!-- Panel — same card treatment as Settings forms -->
  <div class="relative z-10 w-full max-w-lg bg-rep-white dark:bg-gray-900 rounded-2xl shadow-2xl border border-gray-800 dark:border-gray-700 overflow-hidden flex flex-col max-h-[90vh]"
       (click)="$event.stopPropagation()">

    <!-- Header -->
    <div class="flex items-center gap-3 px-6 py-4 border-b border-gray-200 dark:border-gray-700 flex-shrink-0">
      <div class="w-11 h-11 rounded-xl bg-rep-lime flex items-center justify-center flex-shrink-0">
        <i class="fas fa-ticket text-rep-black text-lg"></i>
      </div>
      <div class="flex-1 min-w-0">
        <h2 id="ticket-modal-title" class="text-lg font-bold text-rep-black dark:text-white leading-tight">
          Raise a Support Ticket
        </h2>
        <p class="text-xs text-gray-500 dark:text-gray-400 mt-0.5">
          Our team usually responds within 1–2 business days.
        </p>
      </div>
      <button type="button" (click)="close()"
              class="w-9 h-9 rounded-xl flex items-center justify-center text-gray-500 border-2 border-transparent
                     hover:bg-gray-100 dark:hover:bg-gray-800 hover:border-gray-200 dark:hover:border-gray-600 transition-colors">
        <i class="fas fa-xmark"></i>
      </button>
    </div>

    <!-- Body -->
    <div class="flex-1 overflow-y-auto px-6 py-6 space-y-5">
      <form [formGroup]="form" id="ticket-form" class="space-y-5">

        <!-- Subject -->
        <div>
          <label class="block text-sm font-semibold text-rep-black dark:text-gray-100 mb-2">
            <i class="fas fa-heading mr-2 text-gray-400"></i>
            Subject <span class="text-red-500">*</span>
          </label>
          <input formControlName="subject" type="text" maxlength="200"
                 placeholder="Brief description of the issue"
                 class="w-full px-4 py-3 border-2 border-gray-200 dark:border-gray-600 rounded-xl
                         bg-white dark:bg-gray-800 text-rep-black dark:text-white
                         focus:ring-4 focus:ring-rep-lime/20 focus:border-rep-lime transition
                         placeholder:text-gray-400" />
          <p *ngIf="form.get('subject')?.invalid && form.get('subject')?.touched"
             class="text-xs text-red-500 mt-1.5 flex items-center gap-1">
            <i class="fas fa-circle-exclamation"></i>
            Subject is required (max 200 chars).
          </p>
        </div>

        <!-- Category + Priority -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
          <div>
            <label class="block text-sm font-semibold text-rep-black dark:text-gray-100 mb-2">
              <i class="fas fa-folder mr-2 text-gray-400"></i>
              Category <span class="text-red-500">*</span>
            </label>
            <select formControlName="category"
                    class="w-full px-4 py-3 border-2 border-gray-200 dark:border-gray-600 rounded-xl text-sm
                           bg-white dark:bg-gray-800 text-rep-black dark:text-white
                           focus:ring-4 focus:ring-rep-lime/20 focus:border-rep-lime transition cursor-pointer">
              <option *ngFor="let c of categories" [value]="c.value">{{ c.label }}</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-semibold text-rep-black dark:text-gray-100 mb-2">
              <i class="fas fa-bolt mr-2 text-gray-400"></i>
              Priority
            </label>
            <select formControlName="priority"
                    class="w-full px-4 py-3 border-2 border-gray-200 dark:border-gray-600 rounded-xl text-sm
                           bg-white dark:bg-gray-800 text-rep-black dark:text-white
                           focus:ring-4 focus:ring-rep-lime/20 focus:border-rep-lime transition cursor-pointer">
              <option *ngFor="let p of priorities" [value]="p.value">{{ p.label }}</option>
            </select>
          </div>
        </div>

        <!-- Description -->
        <div>
          <label class="block text-sm font-semibold text-rep-black dark:text-gray-100 mb-2">
            <i class="fas fa-align-left mr-2 text-gray-400"></i>
            Description <span class="text-red-500">*</span>
          </label>
          <textarea formControlName="description" rows="5" maxlength="10000"
                    placeholder="Describe the issue in detail — steps to reproduce, links, etc."
                    class="w-full px-4 py-3 border-2 border-gray-200 dark:border-gray-600 rounded-xl text-sm
                           bg-white dark:bg-gray-800 text-rep-black dark:text-white
                           focus:ring-4 focus:ring-rep-lime/20 focus:border-rep-lime transition resize-y min-h-[120px]
                           placeholder:text-gray-400"></textarea>
          <p *ngIf="form.get('description')?.invalid && form.get('description')?.touched"
             class="text-xs text-red-500 mt-1.5 flex items-center gap-1">
            <i class="fas fa-circle-exclamation"></i>
            Description is required (max 10,000 chars).
          </p>
        </div>

        <!-- Attachments -->
        <div>
          <label class="block text-sm font-semibold text-rep-black dark:text-gray-100 mb-2">
            <i class="fas fa-paperclip mr-2 text-gray-400"></i>
            Attachments
            <span class="font-normal text-gray-500 dark:text-gray-400">(up to 5 files, 20 MB each)</span>
          </label>

          <app-file-upload-zone
            [files]="pendingFiles"
            (filesChange)="pendingFiles = $event"
            [maxFiles]="5"
            [maxFileSizeBytes]="ticketMaxBytes"
            accept="image/*,.pdf,.doc,.docx,.txt,video/mp4,video/quicktime"
            [disabled]="submitting"
            [openMediaGalleryOnClick]="true"
            galleryMediaType="all"
            [excludeGalleryAudio]="true"
            dropzoneHint="Library, device, or drag — images, PDFs, Word, text, video"
          />
        </div>

      </form>
    </div>

    <!-- Footer — primary / secondary like Settings Save vs outline -->
    <div class="flex items-center justify-end gap-3 px-6 py-4 border-t border-gray-200 dark:border-gray-700 flex-shrink-0 bg-gray-50/50 dark:bg-gray-800/30">
      <button type="button" (click)="close()"
              [disabled]="submitting"
              class="px-6 py-3 rounded-xl text-sm font-bold text-gray-700 dark:text-gray-200
                     border-2 border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800
                     hover:bg-gray-50 dark:hover:bg-gray-700
                     disabled:opacity-40 disabled:cursor-not-allowed transition-all">
        Cancel
      </button>
      <button type="submit" form="ticket-form"
              (click)="onSubmit()"
              [disabled]="form.invalid || submitting"
              class="inline-flex items-center justify-center gap-2 px-8 py-4 bg-rep-lime text-rep-black rounded-xl font-bold text-sm sm:text-base
                     hover:shadow-xl hover:shadow-rep-lime/50 transform hover:-translate-y-0.5 transition-all duration-300
                     disabled:opacity-50 disabled:cursor-not-allowed disabled:transform-none">
        <ng-container *ngIf="!submitting">
          <i class="fas fa-paper-plane text-sm"></i>
          Submit Ticket
        </ng-container>
        <span *ngIf="submitting" class="flex items-center gap-2">
          <i class="fas fa-spinner fa-spin text-sm"></i>
          {{ uploadingFiles ? 'Uploading files…' : 'Submitting…' }}
        </span>
      </button>
    </div>

  </div>
</div>
