<div class="min-h-screen w-full bg-white dark:bg-rep-black text-gray-900 dark:text-rep-white flex flex-col overflow-hidden" style="height: 100%;">

  <div class="flex-1 flex flex-col min-h-0 w-full max-w-[1600px] mx-auto p-4 md:p-6">
    <app-contacts-list
      class="flex-1 flex flex-col min-h-0 overflow-hidden"
      (contactSelected)="onContactSelected($event)">
    </app-contacts-list>
  </div>

  <!-- Slide-over detail panel -->
  <div *ngIf="showDetail"
       class="fixed inset-0 z-40 flex justify-end"
       (click)="onBack()">

    <div class="absolute inset-0 bg-black/40 dark:bg-black/60 backdrop-blur-sm"></div>

    <div class="relative z-50 w-full max-w-4xl h-full flex flex-col bg-white dark:bg-gray-900 shadow-2xl border-l border-gray-200 dark:border-gray-700 overflow-hidden"
         (click)="$event.stopPropagation()">
      <app-customer-360
        class="flex-1 flex flex-col overflow-hidden"
        [contactId]="selectedContactId"
        (back)="onBack()"
        (deleted)="onDeleted()"
        (profileSaved)="onProfileSaved()">
      </app-customer-360>
    </div>
  </div>

</div>
