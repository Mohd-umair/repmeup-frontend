<div *ngIf="open" class="fixed inset-0 z-[100] flex items-end sm:items-center justify-center p-0 sm:p-4"
     role="dialog" aria-modal="true" [attr.aria-labelledby]="'help-' + title">
  <div class="absolute inset-0 bg-black/45 dark:bg-black/60 backdrop-blur-sm" (click)="close()"></div>
  <div class="contacts-page-help relative z-10 w-full sm:max-w-xl max-h-[90vh] flex flex-col rounded-t-2xl sm:rounded-2xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-900 shadow-2xl overflow-hidden"
       (click)="$event.stopPropagation()">
    <div class="px-5 py-4 border-b border-gray-200 dark:border-gray-700 bg-gradient-to-r from-gray-50 to-white dark:from-gray-800/80 dark:to-gray-900 shrink-0">
      <div class="flex items-start justify-between gap-3">
        <div>
          <h3 class="text-base font-bold text-gray-900 dark:text-rep-white flex items-center gap-2">
            <i class="fas fa-circle-info text-rep-lime"></i>
            {{ title }}
          </h3>
          <p *ngIf="subtitle" class="text-xs text-gray-500 dark:text-gray-400 mt-1">{{ subtitle }}</p>
        </div>
        <button type="button" (click)="close()"
                class="w-8 h-8 rounded-lg flex items-center justify-center text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors"
                aria-label="Close">
          <i class="fas fa-xmark"></i>
        </button>
      </div>
    </div>

    <div class="flex-1 overflow-y-auto px-5 py-4 space-y-4 contacts-page-help-scroll">
      <div *ngFor="let section of sections" class="rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50/50 dark:bg-gray-800/30 p-3.5">
        <div class="flex items-center gap-2 mb-1.5">
          <span class="w-7 h-7 rounded-lg bg-rep-lime/15 flex items-center justify-center shrink-0">
            <i class="fas text-rep-lime text-xs" [ngClass]="section.icon"></i>
          </span>
          <h4 class="text-sm font-bold text-gray-900 dark:text-gray-100">{{ section.title }}</h4>
        </div>
        <p class="text-xs text-gray-600 dark:text-gray-400 leading-relaxed mb-2">{{ section.summary }}</p>
        <ul class="space-y-1.5">
          <li *ngFor="let ex of section.examples" class="flex items-start gap-2 text-[11px] text-gray-700 dark:text-gray-300">
            <i class="fas fa-lightbulb text-amber-500 text-[9px] mt-1 shrink-0"></i>
            <span>{{ ex }}</span>
          </li>
        </ul>
      </div>

      <div *ngIf="scenarios.length">
        <p class="text-[10px] font-bold uppercase tracking-wide text-gray-400 dark:text-gray-500 mb-2">Example walkthrough</p>
        <div class="space-y-2">
          <div *ngFor="let scenario of scenarios" class="rounded-xl border border-rep-lime/30 bg-rep-lime/5 dark:bg-rep-lime/10 p-3">
            <p class="text-xs font-bold text-gray-900 dark:text-gray-100 mb-2">{{ scenario.title }}</p>
            <ol class="space-y-1">
              <li *ngFor="let step of scenario.steps; let i = index" class="flex items-start gap-2 text-[11px] text-gray-600 dark:text-gray-400">
                <span class="shrink-0 w-4 h-4 rounded-full bg-rep-lime text-rep-black text-[9px] font-bold flex items-center justify-center">{{ i + 1 }}</span>
                <span>{{ step }}</span>
              </li>
            </ol>
          </div>
        </div>
      </div>
    </div>

    <div *ngIf="primaryActionLabel" class="px-5 py-3 border-t border-gray-200 dark:border-gray-700 shrink-0 flex flex-wrap gap-2">
      <button type="button" (click)="onPrimary()"
              class="flex-1 sm:flex-none inline-flex items-center justify-center gap-1.5 px-4 py-2 rounded-lg text-xs font-bold bg-rep-lime text-rep-black hover:brightness-95 transition-all">
        {{ primaryActionLabel }}
      </button>
      <button type="button" (click)="close()"
              class="flex-1 sm:flex-none px-4 py-2 rounded-lg text-xs font-semibold border border-gray-200 dark:border-gray-600 hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors">
        Got it
      </button>
    </div>
    <div *ngIf="!primaryActionLabel" class="px-5 py-3 border-t border-gray-200 dark:border-gray-700 shrink-0">
      <button type="button" (click)="close()"
              class="w-full sm:w-auto px-4 py-2 rounded-lg text-xs font-semibold border border-gray-200 dark:border-gray-600 hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors">
        Got it
      </button>
    </div>
  </div>
</div>
