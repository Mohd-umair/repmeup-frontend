<button
  type="button"
  [class]="variant === 'header' ? 'theme-toggle theme-toggle--header' : 'theme-toggle theme-toggle--fab'"
  (click)="theme.toggle()"
  [attr.aria-label]="theme.isDark() ? 'Switch to light mode' : 'Switch to dark mode'"
  [title]="theme.isDark() ? 'Light mode' : 'Dark mode'"
>
  <i *ngIf="theme.isDark()" class="fas fa-sun" aria-hidden="true"></i>
  <i *ngIf="!theme.isDark()" class="fas fa-moon" aria-hidden="true"></i>
</button>
