<div class="flex h-screen overflow-hidden transition-colors duration-200" style="background-color: var(--surface-secondary);">
  <!-- Global API loader bar (top of page) -->
  <app-global-loader></app-global-loader>

  <!-- Notification System -->
  <app-notification></app-notification>

  <!-- Mobile Sidebar Overlay -->
  <div 
    *ngIf="sidebarOpen" 
    class="fixed inset-0 bg-black bg-opacity-50 z-30 lg:hidden"
    (click)="toggleSidebar()"
  ></div>

  <!-- Sidebar -->
  <app-sidebar 
    [collapsed]="sidebarCollapsed"
    (menuItemClicked)="closeSidebar()"
    class="fixed lg:static inset-y-0 left-0 z-40 transform transition-transform duration-300 ease-in-out lg:transform-none"
    [class.-translate-x-full]="!sidebarOpen"
    [class.translate-x-0]="sidebarOpen"
    [ngClass]="{'lg:translate-x-0': true}"
  ></app-sidebar>

  <!-- Main Content Area -->
  <div class="flex-1 flex flex-col overflow-hidden min-w-0 w-full">
    <!-- Header -->
    <app-header
      [sidebarCollapsed]="sidebarCollapsed"
      (menuToggle)="toggleSidebar()"
      (sidebarCollapseToggle)="toggleSidebarCollapsed()"
    ></app-header>

    <!-- Content -->
    <main #mainScroll class="flex-1 overflow-y-auto overflow-x-hidden w-full flex flex-col">
      <ng-container *ngIf="limits$ | async as lim">
        <div *ngIf="lim?.billing?.cancelAtPeriodEnd"
          role="status"
          class="sticky top-0 z-20 shrink-0 border-b border-amber-200 dark:border-amber-800/80 bg-amber-50 dark:bg-amber-950/45 px-3 sm:px-4 py-3">
          <p class="text-sm text-amber-900 dark:text-amber-100 text-center leading-relaxed max-w-4xl mx-auto">
            <i class="fas fa-calendar-times mr-2 opacity-90" aria-hidden="true"></i>
            <strong>Your subscription will end at the end of this billing period</strong>
            <ng-container *ngIf="lim.billing?.currentPeriodEnd">
              (<strong>{{ lim.billing?.currentPeriodEnd | date:'mediumDate' }}</strong>).
            </ng-container>
            You keep full access until then, then your workspace moves to the Free plan.
            <a routerLink="/app/settings/accounts"
              class="ml-1 sm:ml-2 text-amber-950 dark:text-amber-50 font-bold underline underline-offset-2 hover:no-underline whitespace-nowrap">
              Plans &amp; Billing
            </a>
          </p>
        </div>
      </ng-container>
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
