<div class="flex h-screen bg-gray-50 overflow-hidden">
  <!-- Global API loader bar (top of page) -->
  <app-global-loader></app-global-loader>

  <!-- Notification System -->
  <app-notification></app-notification>

  <!-- Mobile Sidebar Overlay -->
  <div 
    *ngIf="sidebarOpen" 
    class="fixed inset-0 bg-black bg-opacity-50 z-30 lg:hidden"
    (click)="toggleSidebar()"
  ></div>

  <!-- Sidebar -->
  <app-sidebar 
    [ngClass]="{'sidebar-open': sidebarOpen, 'sidebar-closed': !sidebarOpen}"
    (menuItemClicked)="closeSidebar()"
    class="fixed lg:static inset-y-0 left-0 z-40 lg:translate-x-0"
  ></app-sidebar>

  <!-- Main Content Area -->
  <div class="flex-1 flex flex-col overflow-hidden min-w-0 w-full">
    <!-- Header -->
    <app-header (menuToggle)="toggleSidebar()"></app-header>

    <!-- Content -->
    <main class="flex-1 overflow-y-auto overflow-x-hidden w-full">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
