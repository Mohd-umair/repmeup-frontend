<!-- Notification Container - Fixed position top-right -->
<div class="fixed top-4 right-4 z-[99999] flex flex-col gap-3 pointer-events-none" style="z-index: 99999;">
  <div 
    *ngFor="let notification of notifications"
    [@slideIn]
    class="pointer-events-auto bg-white rounded-xl shadow-2xl border-l-4 overflow-hidden max-w-md min-w-[320px]"
    [ngClass]="getBorderColor(notification.type)"
  >
    <div class="p-4">
      <!-- Header -->
      <div class="flex items-start justify-between gap-3">
        <div class="flex items-start gap-3 flex-1">
          <!-- Icon -->
          <div class="flex-shrink-0 mt-0.5">
            <i 
              [class]="getIcon(notification.type) + ' text-xl ' + getIconColor(notification.type)"
            ></i>
          </div>
          
          <!-- Content -->
          <div class="flex-1 min-w-0">
            <!-- Title -->
            <h4 class="font-bold text-gray-900 text-sm leading-tight mb-1">
              {{ notification.title }}
            </h4>
            
            <!-- Message -->
            <p 
              *ngIf="notification.message" 
              class="text-gray-600 text-xs leading-relaxed"
            >
              {{ notification.message }}
            </p>

            <!-- Details list -->
            <div 
              *ngIf="notification.details && notification.details.length > 0"
              class="mt-2 space-y-1"
            >
              <div 
                *ngFor="let detail of notification.details"
                class="text-xs text-gray-600 pl-2 border-l-2 border-gray-300"
              >
                {{ detail }}
              </div>
            </div>
          </div>
        </div>

        <!-- Close button -->
        <button
          (click)="removeNotification(notification.id)"
          type="button"
          class="flex-shrink-0 text-gray-400 hover:text-gray-600 transition-colors"
        >
          <i class="fas fa-times text-sm"></i>
        </button>
      </div>
    </div>

    <!-- Progress bar (optional visual indicator) -->
    <div 
      class="h-1 bg-gray-100"
      [ngClass]="{
        'bg-green-100': notification.type === 'success',
        'bg-red-100': notification.type === 'error',
        'bg-yellow-100': notification.type === 'warning',
        'bg-blue-100': notification.type === 'info'
      }"
    >
      <div 
        class="h-full transition-all"
        [style.animation]="'shrink ' + (notification.duration || 4000) + 'ms linear'"
        [ngClass]="{
          'bg-green-500': notification.type === 'success',
          'bg-red-500': notification.type === 'error',
          'bg-yellow-500': notification.type === 'warning',
          'bg-blue-500': notification.type === 'info'
        }"
      ></div>
    </div>
  </div>
</div>
