<div class="post-card rounded-xl border border-gray-200 bg-white shadow-sm transition-colors hover:border-gray-300 dark:border-gray-800 dark:bg-gray-900/50 dark:shadow-none dark:hover:border-gray-600 overflow-hidden">
  <!-- Header: platform icon + status + menu -->
  <div class="flex items-center justify-between p-3 border-b border-gray-200 dark:border-gray-800">
    <div class="flex items-center gap-2">
      <span class="flex items-center justify-center w-8 h-8 rounded-lg bg-gray-100 text-gray-600 dark:bg-gray-800 dark:text-gray-300">
        <i [class]="platformIcon + ' text-sm'"></i>
      </span>
      <span *ngIf="platform?.name" class="text-sm font-medium text-gray-900 dark:text-white">{{ platform.name }}</span>
      <app-status-badge *ngIf="status" [status]="status"></app-status-badge>
      <app-status-badge *ngIf="generatedBy === 'ai'" status="ai_generated"></app-status-badge>
    </div>
    <div class="relative">
      <button
        type="button"
        (click)="toggleMenu(); $event.stopPropagation()"
        class="p-1.5 rounded-lg text-gray-500 hover:text-gray-900 hover:bg-gray-100 dark:text-gray-400 dark:hover:text-white dark:hover:bg-gray-800 transition"
        aria-label="Menu"
      >
        <i class="fas fa-ellipsis-v"></i>
      </button>
      <div
        *ngIf="showMenu"
        class="absolute right-0 top-full mt-1 py-1 w-40 bg-white border border-gray-200 rounded-lg shadow-xl z-10 dark:bg-gray-800 dark:border-gray-700"
        (click)="$event.stopPropagation()"
      >
        <button type="button" (click)="onEdit(); showMenu = false" class="block w-full text-left px-3 py-2 text-sm text-gray-700 hover:bg-gray-50 dark:text-gray-300 dark:hover:bg-gray-700">Edit</button>
        <button type="button" (click)="onSchedule(); showMenu = false" class="block w-full text-left px-3 py-2 text-sm text-gray-700 hover:bg-gray-50 dark:text-gray-300 dark:hover:bg-gray-700">Schedule</button>
      </div>
    </div>
  </div>

  <!-- Post preview text -->
  <div class="p-3">
    <p class="text-sm text-gray-700 whitespace-pre-wrap break-words dark:text-gray-300">{{ truncatedContent }}</p>
  </div>

  <!-- Image/Media preview -->
  <div *ngIf="media.length > 0" class="px-3 pb-2">
    <div class="rounded-lg overflow-hidden border border-gray-200 aspect-video max-h-40 bg-gray-100 dark:border-gray-700 dark:bg-gray-800">
      <img *ngIf="media[0].type === 'image'" [src]="media[0].preview" alt="Post media" class="w-full h-full object-cover">
      <video *ngIf="media[0].type === 'video'" [src]="media[0].preview" class="w-full h-full object-cover"></video>
    </div>
  </div>

  <!-- Meta row: hashtags, time -->
  <div class="px-3 pb-2 flex flex-wrap items-center gap-2 text-xs text-gray-500 dark:text-gray-500">
    <span *ngFor="let tag of hashtags" class="text-blue-600 dark:text-blue-400">#{{ tag }}</span>
    <span *ngIf="scheduledFor" class="flex items-center gap-1 text-gray-600 dark:text-gray-400">
      <i class="fas fa-clock"></i>
      {{ scheduledFor | date:'short' }}
    </span>
    <span *ngIf="riskScore != null" class="text-amber-700 dark:text-amber-400">Risk: {{ riskScore }}%</span>
  </div>

  <!-- Action row -->
  <div *ngIf="showActions" class="p-3 pt-0 flex flex-wrap gap-2">
    <app-button variant="primary" size="sm" (buttonClick)="onApprove()">Approve</app-button>
    <app-button variant="secondary" size="sm" (buttonClick)="onEdit()">Edit</app-button>
    <app-button variant="danger" size="sm" (buttonClick)="onReject()">Reject</app-button>
    <app-button variant="ghost" size="sm" (buttonClick)="onSchedule()">Schedule</app-button>
  </div>
</div>
