<aside
  class="bg-rep-black border-r border-gray-800 h-screen flex flex-col shadow-2xl lg:shadow-none transition-[width] duration-300 ease-in-out overflow-x-visible w-80 max-w-[90vw] lg:max-w-none shrink-0"
  [ngClass]="collapsed ? 'lg:w-[4.5rem]' : 'lg:w-80'"
>
  <!-- Compact brand logo -->
  <div
    class="border-b border-gray-800 flex justify-center shrink-0"
    [ngClass]="collapsed ? 'p-2 lg:p-2.5' : 'px-4 py-3'"
  >
    <a routerLink="/" class="cursor-pointer block" [title]="collapsed ? 'Home' : null" (click)="onMenuItemClick()">
      <img
        src="assets/Images/logo.jpeg"
        alt="RepMeUp"
        class="rounded-md shadow-md transition-all duration-300"
        [ngClass]="collapsed ? 'w-8 h-8 object-cover lg:w-8 lg:h-8' : 'h-8 w-auto max-h-8'"
      />
    </a>
  </div>

  <!-- Navigation Menu -->
  <nav class="flex-1 p-3 sm:p-4 space-y-4 overflow-y-auto overflow-x-visible min-h-0">
    <div *ngFor="let section of sidebarSections; trackBy: trackBySection">
      <p
        class="px-3 sm:px-4 mb-2.5 text-sm font-bold text-gray-500 uppercase tracking-wider max-lg:block"
        [ngClass]="{ 'lg:hidden': collapsed }"
      >
        {{ section.label }}
      </p>
      <div class="space-y-1">
        <ng-container *ngFor="let item of section.items; trackBy: trackByItem">
          <!-- Parent with collapsible submenu (Publish, Settings, …) -->
          <div *ngIf="item.children?.length" class="rounded-lg relative">
            <button
              type="button"
              (click)="onParentNavClick($event, section, item)"
              [attr.aria-expanded]="isSubmenuExpanded(section, item)"
              [attr.aria-controls]="submenuPanelDomId(section, item)"
              [ngClass]="{
                'bg-rep-lime/10': item.sidebarParentActive,
                'text-rep-lime': item.sidebarParentActive,
                'border-rep-lime': item.sidebarParentActive,
                'lg:justify-center': collapsed,
                'lg:px-2': collapsed
              }"
              class="w-full flex items-center justify-between px-3 sm:px-4 py-3 sm:py-3.5 rounded-lg text-gray-300 hover:bg-gray-800 hover:text-rep-white transition cursor-pointer border-l-4 border-transparent text-left max-lg:justify-between"
              [attr.title]="collapsed ? item.label : null"
              [attr.aria-label]="item.label"
            >
              <div
                class="flex items-center space-x-2 sm:space-x-3 min-w-0"
                [ngClass]="{ 'lg:justify-center': collapsed, 'lg:space-x-0': collapsed }"
              >
                <span class="relative shrink-0">
                  <i *ngIf="isFaIcon(item.icon)" [class]="item.icon + ' text-xl sm:text-2xl w-6'" aria-hidden="true"></i>
                  <span *ngIf="!isFaIcon(item.icon)" class="text-2xl sm:text-3xl" aria-hidden="true">{{ item.icon }}</span>
                  <span
                    *ngIf="collapsed && item.badge && item.badge > 0"
                    class="lg:absolute lg:-top-1 lg:-right-1 lg:w-2 lg:h-2 lg:rounded-full lg:bg-rep-lime max-lg:hidden"
                    aria-hidden="true"
                  ></span>
                </span>
                <span class="text-base sm:text-lg font-semibold truncate max-lg:inline" [ngClass]="{ 'lg:hidden': collapsed }">{{
                  item.label
                }}</span>
              </div>
              <i
                class="submenu-chevron fas fa-chevron-down text-sm text-gray-500 shrink-0 ml-2 max-lg:inline-block"
                [ngClass]="{ 'lg:hidden': collapsed, 'submenu-chevron--open': isSubmenuExpanded(section, item) }"
                aria-hidden="true"
              ></i>
            </button>
            <!-- Accordion: hidden on lg+ when collapsed rail (flyout used instead); always available below lg -->
            <div
              class="submenu-panel"
              [ngClass]="{ 'lg:hidden': collapsed, 'submenu-panel--open': isSubmenuExpanded(section, item) }"
              [id]="submenuPanelDomId(section, item)"
              role="group"
              [attr.aria-label]="item.label + ' submenu'"
              [attr.aria-hidden]="isSubmenuExpanded(section, item) ? null : true"
              [attr.inert]="isSubmenuExpanded(section, item) ? null : ''"
            >
              <div class="submenu-panel__inner">
                <div class="mt-1 ml-2 pl-3 border-l border-gray-700 space-y-0.5 pb-0.5">
                  <a
                    *ngFor="let child of item.children; trackBy: trackByChild"
                    [routerLink]="child.route"
                    [queryParams]="child.queryParams || null"
                    (click)="onMenuItemClick(); closeFlyout()"
                    routerLinkActive="bg-rep-lime/10 text-rep-lime border-rep-lime"
                    [routerLinkActiveOptions]="childLinkActiveOptions(child)"
                    class="flex items-center gap-2 sm:gap-3 px-3 sm:px-4 py-2.5 rounded-lg text-base text-gray-400 hover:bg-gray-800 hover:text-rep-white transition cursor-pointer border-l-4 border-transparent"
                  >
                    <i *ngIf="isFaIcon(child.icon)" [class]="child.icon + ' text-base w-5 shrink-0'" aria-hidden="true"></i>
                    <span *ngIf="!isFaIcon(child.icon)" class="text-lg shrink-0" aria-hidden="true">{{ child.icon }}</span>
                    <span class="font-semibold truncate">{{ child.label }}</span>
                  </a>
                </div>
              </div>
            </div>

            <!-- Collapsed desktop: fixed flyout (not clipped by nav overflow; above main content) -->
            <div
              *ngIf="collapsed && isFlyoutOpen(section, item) && flyoutPosition"
              class="hidden lg:block fixed w-64 rounded-lg border border-gray-700 bg-rep-black shadow-2xl py-1 z-[100]"
              role="menu"
              [attr.aria-label]="item.label"
              [style.top.px]="flyoutPosition.top"
              [style.left.px]="flyoutPosition.left"
            >
              <a
                *ngFor="let child of item.children; trackBy: trackByChild"
                [routerLink]="child.route"
                [queryParams]="child.queryParams || null"
                (click)="onMenuItemClick(); closeFlyout()"
                routerLinkActive="bg-rep-lime/10 text-rep-lime"
                [routerLinkActiveOptions]="childLinkActiveOptions(child)"
                class="flex items-center gap-2 px-3 py-2.5 text-base text-gray-300 hover:bg-gray-800 hover:text-rep-white transition"
              >
                <i *ngIf="isFaIcon(child.icon)" [class]="child.icon + ' text-base w-5 shrink-0'" aria-hidden="true"></i>
                <span *ngIf="!isFaIcon(child.icon)" class="text-lg shrink-0" aria-hidden="true">{{ child.icon }}</span>
                <span class="font-semibold truncate">{{ child.label }}</span>
              </a>
            </div>
          </div>

          <!-- Single link -->
          <a
            *ngIf="!item.children?.length"
            [routerLink]="item.route"
            (click)="onMenuItemClick(); closeFlyout()"
            routerLinkActive="bg-rep-lime/10 text-rep-lime border-rep-lime"
            [routerLinkActiveOptions]="routerLinkActiveOptionsForTopLevel(item.route)"
            class="flex items-center justify-between px-3 sm:px-4 py-3 sm:py-3.5 rounded-lg text-gray-300 hover:bg-gray-800 hover:text-rep-white transition cursor-pointer border-l-4 border-transparent"
            [ngClass]="{ 'lg:justify-center': collapsed, 'lg:px-2': collapsed }"
            [attr.title]="collapsed ? item.label : null"
            [attr.aria-label]="item.label"
          >
            <div class="flex items-center space-x-2 sm:space-x-3 min-w-0" [ngClass]="{ 'lg:justify-center': collapsed, 'lg:space-x-0': collapsed }">
              <span class="relative shrink-0">
                <i *ngIf="isFaIcon(item.icon)" [class]="item.icon + ' text-xl sm:text-2xl w-6'" aria-hidden="true"></i>
                <span *ngIf="!isFaIcon(item.icon)" class="text-2xl sm:text-3xl" aria-hidden="true">{{ item.icon }}</span>
                <span
                  *ngIf="collapsed && item.badge && item.badge > 0"
                  class="lg:absolute lg:-top-1 lg:-right-1 lg:w-2 lg:h-2 lg:rounded-full lg:bg-rep-lime max-lg:hidden"
                  aria-hidden="true"
                ></span>
              </span>
              <span class="text-base sm:text-lg font-semibold max-lg:inline" [ngClass]="{ 'lg:hidden': collapsed }">{{ item.label }}</span>
            </div>
            <span
              *ngIf="item.badge && item.badge > 0"
              class="px-2 sm:px-2.5 py-0.5 sm:py-1 text-sm font-bold text-rep-black bg-rep-lime rounded-full max-lg:inline-flex"
              [ngClass]="{ 'lg:hidden': collapsed }"
            >
              {{ item.badge }}
            </span>
          </a>
        </ng-container>
      </div>
    </div>
  </nav>

  <!-- Reppy AI status — pinned to bottom of sidebar -->
  <div [ngClass]="{ 'lg:hidden': collapsed }" class="border-t border-gray-800/60 shrink-0 pb-1">
    <app-inbox-automation-status
      *ngIf="sidebarOrgId"
      [orgId]="sidebarOrgId!">
    </app-inbox-automation-status>
  </div>

  <!-- Theme Toggle -->
  <div class="px-3 sm:px-4 pt-2 pb-3 border-t border-gray-800 shrink-0" [ngClass]="{ 'lg:px-2': collapsed }">
    <div
      class="flex items-center justify-center gap-2 p-1.5 bg-gray-900/60 rounded-lg"
      [ngClass]="{ 'lg:flex-col': collapsed, 'lg:gap-1': collapsed }"
    >
      <button
        type="button"
        (click)="appearance.setMode('light')"
        class="flex-1 flex items-center justify-center gap-1.5 px-3 py-2 rounded-md text-sm font-semibold transition-all duration-200 hover:text-gray-200"
        [class.bg-rep-white]="!appearance.isDark()"
        [class.text-rep-black]="!appearance.isDark()"
        [class.shadow-sm]="!appearance.isDark()"
        [class.text-gray-400]="appearance.isDark()"
        [attr.title]="'Light theme'"
        [attr.aria-label]="'Light theme'"
      >
        <i class="fas fa-sun text-xs"></i>
        <span class="max-lg:inline" [ngClass]="{ 'lg:hidden': collapsed }">Light</span>
      </button>
      <button
        type="button"
        (click)="appearance.setMode('dark')"
        class="flex-1 flex items-center justify-center gap-1.5 px-3 py-2 rounded-md text-sm font-semibold transition-all duration-200 hover:text-gray-200"
        [class.bg-gray-700]="appearance.isDark()"
        [class.text-rep-white]="appearance.isDark()"
        [class.shadow-sm]="appearance.isDark()"
        [class.text-gray-400]="!appearance.isDark()"
        [attr.title]="'Dark theme'"
        [attr.aria-label]="'Dark theme'"
      >
        <i class="fas fa-moon text-xs"></i>
        <span class="max-lg:inline" [ngClass]="{ 'lg:hidden': collapsed }">Dark</span>
      </button>
    </div>
  </div>
</aside>
