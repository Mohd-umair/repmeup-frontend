<aside class="w-64 bg-rep-black border-r border-gray-800 h-screen flex flex-col">
  <!-- Logo Section -->
  <div class="p-6 border-b border-gray-800 flex justify-center">
    <a routerLink="/" class="cursor-pointer">
      <img src="assets/Images/logo.jpeg" alt="RepMeUp Logo" class="w-26 h-20 rounded-lg object-cover shadow-lg">
    </a>
  </div>

  <!-- Navigation Menu -->
  <nav class="flex-1 p-4 space-y-1 overflow-y-auto">
    <a
      *ngFor="let item of menuItems"
      [routerLink]="item.route"
      routerLinkActive="bg-rep-lime/10 text-rep-lime border-rep-lime"
      class="flex items-center justify-between px-4 py-3 rounded-lg text-gray-300 hover:bg-gray-800 hover:text-rep-white transition cursor-pointer border-l-4 border-transparent"
    >
      <div class="flex items-center space-x-3">
        <span class="text-2xl">{{ item.icon }}</span>
        <span class="font-medium">{{ item.label }}</span>
      </div>
      <span 
        *ngIf="item.badge && item.badge > 0" 
        class="px-2 py-1 text-xs font-semibold text-rep-black bg-rep-lime rounded-full"
      >
        {{ item.badge }}
      </span>
    </a>
  </nav>

  <!-- User Section -->
  <div class="p-4 border-t border-gray-800">
    <div class="flex items-center space-x-3 p-3 rounded-lg hover:bg-gray-800 cursor-pointer">
      <div class="w-10 h-10 bg-rep-lime rounded-full flex items-center justify-center">
        <span class="text-rep-black font-semibold">U</span>
      </div>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium text-rep-white truncate">User Name</p>
        <p class="text-xs text-gray-400 truncate">user&#64;example.com</p>
      </div>
      <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
      </svg>
    </div>
  </div>
</aside>
