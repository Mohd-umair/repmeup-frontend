<aside class="w-64 bg-rep-black border-r border-gray-800 h-screen flex flex-col shadow-2xl lg:shadow-none transition-transform duration-300 ease-in-out">
  <!-- Logo Section -->
  <div class="p-4 sm:p-6 border-b border-gray-800 flex justify-center">
    <a routerLink="/" class="cursor-pointer">
      <img src="assets/Images/logo.jpeg" alt="RepMeUp Logo" class="w-25 h-16 sm:w-26 sm:h-20 rounded-lg object-cover shadow-lg">
    </a>
  </div>

  <!-- Navigation Menu -->
  <nav class="flex-1 p-3 sm:p-4 space-y-4 overflow-y-auto">
    <div *ngFor="let section of sidebarSections; trackBy: trackBySection">
      <p class="px-3 sm:px-4 mb-2 text-xs font-semibold text-gray-500 uppercase tracking-wider">{{ section.label }}</p>
      <div class="space-y-1">
        <ng-container *ngFor="let item of section.items; trackBy: trackByItem">
          <!-- Parent with collapsible submenu (Publish, Settings, …) -->
          <div *ngIf="item.children?.length" class="rounded-lg">
            <button
              type="button"
              (click)="toggleSubmenu(section, item)"
              [attr.aria-expanded]="isSubmenuExpanded(section, item)"
              [attr.aria-controls]="submenuPanelDomId(section, item)"
              [ngClass]="{
                'bg-rep-lime/10': item.sidebarParentActive,
                'text-rep-lime': item.sidebarParentActive,
                'border-rep-lime': item.sidebarParentActive
              }"
              class="w-full flex items-center justify-between px-3 sm:px-4 py-2.5 sm:py-3 rounded-lg text-gray-300 hover:bg-gray-800 hover:text-rep-white transition cursor-pointer border-l-4 border-transparent text-left"
            >
              <div class="flex items-center space-x-2 sm:space-x-3 min-w-0">
                <span class="text-xl sm:text-2xl shrink-0" aria-hidden="true">{{ item.icon }}</span>
                <span class="text-sm sm:text-base font-medium truncate">{{ item.label }}</span>
              </div>
              <i
                class="submenu-chevron fas fa-chevron-down text-xs text-gray-500 shrink-0 ml-2"
                [class.submenu-chevron--open]="isSubmenuExpanded(section, item)"
                aria-hidden="true"
              ></i>
            </button>
            <div
              class="submenu-panel"
              [class.submenu-panel--open]="isSubmenuExpanded(section, item)"
              [id]="submenuPanelDomId(section, item)"
              role="group"
              [attr.aria-label]="item.label + ' submenu'"
              [attr.aria-hidden]="isSubmenuExpanded(section, item) ? null : true"
              [attr.inert]="isSubmenuExpanded(section, item) ? null : ''"
            >
              <div class="submenu-panel__inner">
                <div class="mt-1 ml-2 pl-3 border-l border-gray-700 space-y-0.5 pb-0.5">
                  <a
                    *ngFor="let child of item.children; trackBy: trackByChild"
                    [routerLink]="child.route"
                    [queryParams]="child.queryParams || null"
                    (click)="onMenuItemClick()"
                    routerLinkActive="bg-rep-lime/10 text-rep-lime border-rep-lime"
                    [routerLinkActiveOptions]="childLinkActiveOptions(child)"
                    class="flex items-center gap-2 sm:gap-3 px-3 sm:px-4 py-2 rounded-lg text-sm text-gray-400 hover:bg-gray-800 hover:text-rep-white transition cursor-pointer border-l-4 border-transparent"
                  >
                    <span class="text-base shrink-0" aria-hidden="true">{{ child.icon }}</span>
                    <span class="font-medium truncate">{{ child.label }}</span>
                  </a>
                </div>
              </div>
            </div>
          </div>

          <!-- Single link -->
          <a
            *ngIf="!item.children?.length"
            [routerLink]="item.route"
            (click)="onMenuItemClick()"
            routerLinkActive="bg-rep-lime/10 text-rep-lime border-rep-lime"
            class="flex items-center justify-between px-3 sm:px-4 py-2.5 sm:py-3 rounded-lg text-gray-300 hover:bg-gray-800 hover:text-rep-white transition cursor-pointer border-l-4 border-transparent"
          >
            <div class="flex items-center space-x-2 sm:space-x-3">
              <span class="text-xl sm:text-2xl">{{ item.icon }}</span>
              <span class="text-sm sm:text-base font-medium">{{ item.label }}</span>
            </div>
            <span
              *ngIf="item.badge && item.badge > 0"
              class="px-1.5 sm:px-2 py-0.5 sm:py-1 text-xs font-semibold text-rep-black bg-rep-lime rounded-full"
            >
              {{ item.badge }}
            </span>
          </a>
        </ng-container>
      </div>
    </div>
  </nav>

  <!-- Theme Toggle -->
  <div class="px-3 sm:px-4 pt-3 border-t border-gray-800">
    <div class="flex items-center justify-center gap-2 p-1.5 bg-gray-900/60 rounded-lg">
      <button
        (click)="appearance.setMode('light')"
        class="flex-1 flex items-center justify-center gap-1.5 px-3 py-1.5 rounded-md text-xs font-semibold transition-all duration-200"
        [class.bg-rep-white]="!appearance.isDark()"
        [class.text-rep-black]="!appearance.isDark()"
        [class.shadow-sm]="!appearance.isDark()"
        [class.text-gray-400]="appearance.isDark()"
        [class.hover:text-gray-200]="appearance.isDark()">
        <i class="fas fa-sun text-[10px]"></i>
        Light
      </button>
      <button
        (click)="appearance.setMode('dark')"
        class="flex-1 flex items-center justify-center gap-1.5 px-3 py-1.5 rounded-md text-xs font-semibold transition-all duration-200"
        [class.bg-gray-700]="appearance.isDark()"
        [class.text-rep-white]="appearance.isDark()"
        [class.shadow-sm]="appearance.isDark()"
        [class.text-gray-400]="!appearance.isDark()"
        [class.hover:text-gray-200]="!appearance.isDark()">
        <i class="fas fa-moon text-[10px]"></i>
        Dark
      </button>
    </div>
  </div>
</aside>
