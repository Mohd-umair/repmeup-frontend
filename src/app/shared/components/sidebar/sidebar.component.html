<aside class="w-64 bg-rep-black border-r border-gray-800 h-screen flex flex-col shadow-2xl lg:shadow-none transition-transform duration-300 ease-in-out">
  <!-- Logo Section -->
  <div class="p-4 sm:p-6 border-b border-gray-800 flex justify-center">
    <a routerLink="/" class="cursor-pointer">
      <img src="assets/Images/logo.jpeg" alt="RepMeUp Logo" class="w-25 h-16 sm:w-26 sm:h-20 rounded-lg object-cover shadow-lg">
    </a>
  </div>

  <!-- Navigation Menu -->
  <nav class="flex-1 p-3 sm:p-4 space-y-4 overflow-y-auto">
    <!-- Main -->
    <div *ngIf="groupedItems.main.length > 0">
      <p class="px-3 sm:px-4 mb-2 text-xs font-semibold text-gray-500 uppercase tracking-wider">Main</p>
      <div class="space-y-1">
        <a
          *ngFor="let item of groupedItems.main"
          [routerLink]="item.route"
          (click)="onMenuItemClick()"
          routerLinkActive="bg-rep-lime/10 text-rep-lime border-rep-lime"
          class="flex items-center justify-between px-3 sm:px-4 py-2.5 sm:py-3 rounded-lg text-gray-300 hover:bg-gray-800 hover:text-rep-white transition cursor-pointer border-l-4 border-transparent"
        >
          <div class="flex items-center space-x-2 sm:space-x-3">
            <span class="text-xl sm:text-2xl">{{ item.icon }}</span>
            <span class="text-sm sm:text-base font-medium">{{ item.label }}</span>
          </div>
          <span 
            *ngIf="item.badge && item.badge > 0" 
            class="px-1.5 sm:px-2 py-0.5 sm:py-1 text-xs font-semibold text-rep-black bg-rep-lime rounded-full"
          >
            {{ item.badge }}
          </span>
        </a>
      </div>
    </div>

    <!-- Management -->
    <div *ngIf="groupedItems.management.length > 0">
      <p class="px-3 sm:px-4 mb-2 text-xs font-semibold text-gray-500 uppercase tracking-wider">Management</p>
      <div class="space-y-1">
        <a
          *ngFor="let item of groupedItems.management"
          [routerLink]="item.route"
          (click)="onMenuItemClick()"
          routerLinkActive="bg-rep-lime/10 text-rep-lime border-rep-lime"
          class="flex items-center justify-between px-3 sm:px-4 py-2.5 sm:py-3 rounded-lg text-gray-300 hover:bg-gray-800 hover:text-rep-white transition cursor-pointer border-l-4 border-transparent"
        >
          <div class="flex items-center space-x-2 sm:space-x-3">
            <span class="text-xl sm:text-2xl">{{ item.icon }}</span>
            <span class="text-sm sm:text-base font-medium">{{ item.label }}</span>
          </div>
          <span 
            *ngIf="item.badge && item.badge > 0" 
            class="px-1.5 sm:px-2 py-0.5 sm:py-1 text-xs font-semibold text-rep-black bg-rep-lime rounded-full"
          >
            {{ item.badge }}
          </span>
        </a>
      </div>
    </div>

    <!-- Settings -->
    <div *ngIf="groupedItems.settings.length > 0">
      <p class="px-3 sm:px-4 mb-2 text-xs font-semibold text-gray-500 uppercase tracking-wider">Settings</p>
      <div class="space-y-1">
        <a
          *ngFor="let item of groupedItems.settings"
          [routerLink]="item.route"
          (click)="onMenuItemClick()"
          routerLinkActive="bg-rep-lime/10 text-rep-lime border-rep-lime"
          class="flex items-center justify-between px-3 sm:px-4 py-2.5 sm:py-3 rounded-lg text-gray-300 hover:bg-gray-800 hover:text-rep-white transition cursor-pointer border-l-4 border-transparent"
        >
          <div class="flex items-center space-x-2 sm:space-x-3">
            <span class="text-xl sm:text-2xl">{{ item.icon }}</span>
            <span class="text-sm sm:text-base font-medium">{{ item.label }}</span>
          </div>
          <span 
            *ngIf="item.badge && item.badge > 0" 
            class="px-1.5 sm:px-2 py-0.5 sm:py-1 text-xs font-semibold text-rep-black bg-rep-lime rounded-full"
          >
            {{ item.badge }}
          </span>
        </a>
      </div>
    </div>
  </nav>

  <!-- User Section -->
  <div class="p-3 sm:p-4 border-t border-gray-800">
    <div class="flex items-center space-x-2 sm:space-x-3 p-2 sm:p-3 rounded-lg bg-gray-900/50">
      <div class="w-8 h-8 sm:w-10 sm:h-10 bg-rep-lime rounded-full flex items-center justify-center flex-shrink-0">
        <span class="text-sm sm:text-base text-rep-black font-semibold">{{ getUserInitials() }}</span>
      </div>
      <div class="flex-1 min-w-0">
        <p class="text-xs sm:text-sm font-medium text-rep-white truncate">{{ getUserDisplayName() }}</p>
        <p class="text-xs text-gray-400 truncate">{{ getUserEmail() }}</p>
      </div>
      <button 
        (click)="logout()"
        class="w-8 h-8 sm:w-9 sm:h-9 bg-red-500/10 hover:bg-red-500/20 rounded-lg flex items-center justify-center flex-shrink-0 transition-colors cursor-pointer group"
        title="Logout"
      >
        <i class="fas fa-sign-out-alt text-red-500 group-hover:text-red-400 text-sm sm:text-base"></i>
      </button>
    </div>
  </div>
</aside>
