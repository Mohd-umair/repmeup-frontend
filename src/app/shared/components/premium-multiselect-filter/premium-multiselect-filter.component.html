<div class="relative min-w-0 flex-1 sm:min-w-[9.5rem]">
  <span class="block text-xs font-semibold text-gray-500 dark:text-gray-400 mb-1.5 tracking-wide">{{ label }}</span>

  <button
    type="button"
    (click)="toggleOpen(); $event.stopPropagation()"
    [ngClass]="open ? 'ring-2 ring-rep-lime/40 border-rep-lime shadow-md' : ''"
    class="w-full flex items-center justify-between gap-2 px-3 py-2.5 rounded-xl border text-left text-sm font-medium shadow-sm transition-all duration-200
      bg-white dark:bg-gray-800/70 border-gray-200 dark:border-gray-700 text-gray-800 dark:text-gray-100
      hover:border-rep-lime/70 hover:shadow-md
      focus:outline-none focus-visible:ring-2 focus-visible:ring-rep-lime/40"
    [attr.aria-expanded]="open">
    <span class="flex items-center gap-2 min-w-0">
      <span *ngIf="selected.length > 0"
            class="shrink-0 inline-flex items-center justify-center min-w-[1.25rem] h-5 px-1.5 rounded-full bg-rep-lime text-rep-black text-[11px] font-bold">
        {{ selected.length }}
      </span>
      <span class="truncate" [ngClass]="selected.length === 0 ? 'text-gray-400 dark:text-gray-500 font-normal' : ''">
        {{ summary() }}
      </span>
    </span>
    <span class="flex items-center gap-1 flex-shrink-0">
      <button
        *ngIf="selected.length > 0"
        type="button"
        (click)="clear($event)"
        class="p-0.5 rounded-md text-gray-400 hover:text-red-500 hover:bg-red-50 dark:hover:bg-red-900/20"
        title="Clear">
        <i class="fas fa-xmark text-xs"></i>
      </button>
      <i class="fas fa-chevron-down text-[11px] text-gray-400 transition-transform duration-200" [class.rotate-180]="open"></i>
    </span>
  </button>

  <div
    *ngIf="open"
    class="ms-panel absolute left-0 right-0 z-[70] mt-2 p-1.5 rounded-xl border
      bg-white dark:bg-gray-900 border-gray-200/80 dark:border-gray-700
      shadow-2xl shadow-black/10 dark:shadow-black/50 ring-1 ring-black/5 dark:ring-white/10"
    (click)="$event.stopPropagation()">
    <div class="ms-scroll max-h-60 overflow-y-auto">
      <button
        *ngFor="let opt of options"
        type="button"
        (click)="toggleValue(opt.value, $event)"
        [disabled]="opt.disabled"
        [attr.title]="opt.disabled ? (opt.disabledHint || 'Coming soon') : null"
        [ngClass]="{
          'bg-rep-lime/15 dark:bg-rep-lime/10': isSelected(opt.value),
          'opacity-50 cursor-not-allowed': opt.disabled
        }"
        class="w-full flex items-center gap-2.5 px-2.5 py-2 rounded-lg text-left text-sm transition-colors duration-150
          hover:bg-rep-lime/10 dark:hover:bg-rep-lime/10 text-gray-700 dark:text-gray-200 disabled:hover:bg-transparent">
        <span
          class="w-4 h-4 rounded-[5px] border flex items-center justify-center flex-shrink-0 transition-colors"
          [class.bg-rep-lime]="isSelected(opt.value)"
          [class.border-rep-lime]="isSelected(opt.value)"
          [class.border-gray-300]="!isSelected(opt.value)"
          [class.dark:border-gray-600]="!isSelected(opt.value)">
          <i *ngIf="isSelected(opt.value)" class="fas fa-check text-[9px] text-rep-black"></i>
        </span>
        <i *ngIf="opt.iconClass" [class]="opt.iconClass" [ngClass]="opt.colorClass || 'text-gray-500'" class="shrink-0 w-4 text-center"></i>
        <span *ngIf="opt.icon && !opt.iconClass" class="flex-shrink-0">{{ opt.icon }}</span>
        <span class="truncate" [ngClass]="isSelected(opt.value) ? 'font-semibold text-gray-900 dark:text-white' : ''">
          {{ opt.label }}
        </span>
        <span *ngIf="opt.disabled" class="ml-auto text-[10px] font-semibold uppercase tracking-wide text-gray-400 shrink-0">
          {{ opt.disabledHint || 'Soon' }}
        </span>
      </button>
      <div *ngIf="options.length === 0" class="px-2.5 py-3 text-sm text-gray-400 dark:text-gray-500 text-center">No options</div>
    </div>
  </div>
</div>
