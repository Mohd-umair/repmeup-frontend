<div class="trend-card rounded-xl border border-gray-800 bg-gray-900/50 p-4 hover:border-gray-700 transition">
  <h3 class="text-sm font-semibold text-white mb-1">{{ trend.title }}</h3>
  <p *ngIf="trend.source" class="text-xs text-gray-500 mb-2">{{ trend.source }}</p>
  <div *ngIf="trend.relevanceScore != null" class="mb-2">
    <div class="flex items-center justify-between text-xs mb-1">
      <span class="text-gray-400">Relevance</span>
      <span class="text-gray-300">{{ trend.relevanceScore }}%</span>
    </div>
    <div class="h-1.5 bg-gray-800 rounded-full overflow-hidden">
      <div
        class="h-full bg-rep-lime rounded-full transition-all duration-300"
        [style.width.%]="trend.relevanceScore"
      ></div>
    </div>
  </div>
  <p *ngIf="trend.suggestedAngle" class="text-xs text-gray-400 mb-3 line-clamp-2">{{ trend.suggestedAngle }}</p>
  <app-button variant="primary" size="sm" (buttonClick)="generate.emit(trend)">
    Generate Post
  </app-button>
</div>
