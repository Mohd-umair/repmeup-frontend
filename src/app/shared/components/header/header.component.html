<header class="bg-rep-black border-b border-gray-800 h-16 flex items-center justify-between px-3 sm:px-4 md:px-6">
  <div class="flex items-center min-w-0 shrink-0">
    <!-- Mobile Menu Button -->
    <button 
      (click)="onMenuToggle(); $event.stopPropagation()"
      type="button"
      class="lg:hidden p-2 text-gray-400 hover:text-rep-lime rounded-lg hover:bg-gray-800 transition mr-2 cursor-pointer z-50"
      aria-label="Toggle menu"
      style="touch-action: manipulation;"
    >
      <svg class="h-6 w-6 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
      </svg>
    </button>

    <!-- Desktop: collapse / expand sidebar -->
    <button
      type="button"
      (click)="onSidebarCollapseToggle()"
      class="hidden lg:inline-flex items-center justify-center p-2 mr-2 text-gray-400 hover:text-rep-lime rounded-lg hover:bg-gray-800 transition cursor-pointer shrink-0"
      [attr.aria-label]="sidebarCollapsed ? 'Expand sidebar' : 'Collapse sidebar'"
      [attr.aria-pressed]="sidebarCollapsed"
      title="{{ sidebarCollapsed ? 'Expand sidebar' : 'Collapse sidebar' }}"
    >
      <i class="fas fa-angles-left text-lg" [class.rotate-180]="sidebarCollapsed" aria-hidden="true"></i>
    </button>
  </div>

  <!-- Search Bar -->
  <div class="flex-1 max-w-2xl hidden md:block">
    <div class="relative">
      <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
        <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
        </svg>
      </div>
      <input
        type="text"
        placeholder="Search interactions, customers..."
        class="w-full pl-10 pr-4 py-2 bg-gray-900 border border-gray-700 text-rep-white rounded-lg focus:ring-2 focus:ring-rep-lime focus:border-rep-lime placeholder-gray-400"
      />
    </div>
  </div>

  <!-- Right Section -->
  <div class="flex items-center space-x-2 sm:space-x-3 md:space-x-4 ml-2 sm:ml-4 md:ml-6">
    <!-- Notifications -->
    <div class="relative">
      <button 
        (click)="toggleNotifications()"
        class="relative p-2 text-gray-400 hover:text-rep-lime rounded-lg hover:bg-gray-800 transition"
      >
        <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path>
        </svg>
        <span *ngIf="notificationCount > 0" class="absolute top-1 right-1 w-5 h-5 bg-rep-lime text-rep-black text-xs font-bold rounded-full flex items-center justify-center">
          {{ notificationCount }}
        </span>
      </button>

      <!-- Notification Dropdown (explicit light + dark tokens) -->
      <div 
        *ngIf="showNotifications"
        class="absolute right-0 mt-2 w-96 max-w-[calc(100vw-2rem)] rounded-xl shadow-2xl z-50 max-h-[80vh] overflow-hidden flex flex-col
               bg-white border border-gray-200 text-gray-900
               dark:bg-rep-black dark:border-gray-800 dark:text-rep-white"
      >
        <!-- Header -->
        <div class="flex items-center justify-between p-4 border-b border-gray-200 dark:border-gray-800 bg-gray-50/80 dark:bg-transparent">
          <h3 class="text-base font-bold text-gray-900 dark:text-rep-white flex items-center">
            <span class="mr-2" aria-hidden="true">🔔</span>
            Notifications
          </h3>
          <button 
            *ngIf="notificationCount > 0"
            (click)="markAllAsRead()"
            type="button"
            class="text-xs font-semibold text-rep-black dark:text-rep-lime hover:opacity-80"
          >
            Mark all read
          </button>
        </div>

        <!-- Notifications List -->
        <div class="overflow-y-auto flex-1 bg-white dark:bg-rep-black">
          <!-- Loading State -->
          <div *ngIf="loadingNotifications" class="p-8 text-center">
            <i class="fas fa-spinner fa-spin text-3xl text-rep-lime mb-2"></i>
            <p class="text-sm text-gray-600 dark:text-gray-400">Loading notifications...</p>
          </div>

          <!-- Empty State -->
          <div *ngIf="!loadingNotifications && notifications.length === 0" class="p-8 text-center">
            <span class="text-5xl mb-3 block" aria-hidden="true">🎉</span>
            <p class="font-medium text-gray-700 dark:text-gray-300">All caught up!</p>
            <p class="text-sm text-gray-500 dark:text-gray-500 mt-1">No new notifications</p>
          </div>

          <!-- Notification Items -->
          <div *ngIf="!loadingNotifications && notifications.length > 0">
            <button
              *ngFor="let notification of notifications"
              type="button"
              (click)="markAsRead(notification)"
              class="w-full text-left p-4 border-b border-gray-100 dark:border-gray-800 transition
                     hover:bg-gray-100 dark:hover:bg-gray-900"
              [ngClass]="{
                'opacity-60': notification.isRead,
                'bg-rep-lime/10 dark:bg-gray-900/40': !notification.isRead
              }"
            >
              <div class="flex items-start space-x-3">
                <div class="flex-shrink-0 mt-1">
                  <span class="text-2xl">{{ getNotificationIcon(notification.type) }}</span>
                </div>
                <div class="flex-1 min-w-0">
                  <div class="flex items-start justify-between gap-2">
                    <p class="text-sm font-bold text-gray-900 dark:text-rep-white">{{ notification.title }}</p>
                    <span *ngIf="!notification.isRead" class="w-2 h-2 bg-rep-lime rounded-full flex-shrink-0 mt-1.5" aria-hidden="true"></span>
                  </div>
                  <p class="text-sm text-gray-600 dark:text-gray-400 mt-1 line-clamp-2">{{ notification.message }}</p>
                  <p class="text-xs text-gray-500 dark:text-gray-500 mt-2">{{ getTimeAgo(notification.createdAt) }}</p>
                </div>
              </div>
            </button>
          </div>
        </div>

        <!-- Footer -->
        <div *ngIf="notifications.length > 0" class="p-3 border-t border-gray-200 dark:border-gray-800 bg-gray-50 dark:bg-gray-900/50">
          <button 
            type="button"
            (click)="navigateToNotifications()"
            class="w-full text-center text-sm font-semibold text-rep-black dark:text-rep-lime hover:opacity-80"
          >
            View all notifications
          </button>
        </div>
      </div>
    </div>

    <!-- AI Credits Badge -->
    <a
      routerLink="/app/content-studio"
      class="flex items-center gap-2 px-3 py-2 bg-rep-lime text-rep-black rounded-lg font-semibold hover:shadow-lg transition cursor-pointer"
      title="Create post (Content Studio)"
    >
      <i class="fas fa-wand-magic-sparkles"></i>
      <span class="hidden sm:inline">Generate</span>
    </a>
    <button 
      *ngIf="aiCredits"
      (click)="navigateToCredits()"
      class="flex items-center gap-2 px-3 py-1.5 rounded-lg transition cursor-pointer border"
      [ngClass]="aiCredits.isAtLimit
        ? 'bg-red-100 dark:bg-red-500/20 border-red-300 dark:border-red-500/40 hover:bg-red-200 dark:hover:bg-red-500/30'
        : aiCredits.isNearLimit
          ? 'bg-amber-100 dark:bg-amber-500/20 border-amber-300 dark:border-amber-500/40 hover:bg-amber-200 dark:hover:bg-amber-500/30'
          : 'bg-purple-100 dark:bg-purple-500/20 border-purple-300 dark:border-purple-500/30 hover:bg-purple-200 dark:hover:bg-purple-500/30'"
      title="View AI Credits Usage"
    >
      <i class="fas fa-bolt"
         [ngClass]="aiCredits.isAtLimit ? 'text-red-600 dark:text-red-400' : aiCredits.isNearLimit ? 'text-amber-600 dark:text-amber-400' : 'text-purple-600 dark:text-purple-400'"></i>
      <div class="hidden sm:flex flex-col items-start">
        <span class="text-xs font-semibold leading-none"
              [ngClass]="aiCredits.isAtLimit ? 'text-red-700 dark:text-red-400' : aiCredits.isNearLimit ? 'text-amber-700 dark:text-amber-400' : 'text-purple-700 dark:text-purple-300'">
          {{ aiCredits.isUnlimited ? '∞' : aiCredits.remaining }}
        </span>
        <span class="text-[10px] text-gray-500 dark:text-gray-400 leading-none mt-0.5">credits</span>
      </div>
      <span class="text-xs font-bold sm:hidden"
            [ngClass]="aiCredits.isAtLimit ? 'text-red-700 dark:text-red-400' : aiCredits.isNearLimit ? 'text-amber-700 dark:text-amber-400' : 'text-purple-700 dark:text-purple-300'">
        {{ aiCredits.isUnlimited ? '∞' : aiCredits.remaining }}
      </span>
    </button>

    <!-- Help → public FAQ -->
    <a
      routerLink="/faq"
      class="p-2 text-gray-400 hover:text-rep-lime rounded-lg hover:bg-gray-800 transition inline-flex shrink-0"
      title="Help & FAQ"
      aria-label="Open frequently asked questions">
      <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
      </svg>
    </a>

    <!-- User Menu -->
    <div class="relative">
      <button 
        (click)="toggleUserMenu()"
        class="flex items-center space-x-3 p-2 rounded-lg hover:bg-gray-800 transition"
      >
        <div class="w-8 h-8 bg-rep-lime rounded-full flex items-center justify-center text-rep-black font-semibold text-sm">
          {{ getUserInitials() }}
        </div>
        <div class="text-left hidden md:block">
          <p class="text-sm font-medium text-rep-white">{{ currentUser?.firstName }} {{ currentUser?.lastName }}</p>
          <p class="text-xs text-gray-400">{{ currentUser?.role }}</p>
        </div>
        <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
        </svg>
      </button>

      <!-- Dropdown Menu -->
      <div 
        *ngIf="showUserMenu"
        class="absolute right-0 mt-2 w-56 bg-rep-black rounded-lg shadow-lg border border-gray-800 py-1 z-50"
      >
        <a href="#" class="block px-4 py-2 text-sm text-gray-300 hover:bg-gray-800 hover:text-rep-white">
          <div class="flex items-center space-x-2">
            <span>👤</span>
            <span>Profile</span>
          </div>
        </a>
        <a href="#" class="block px-4 py-2 text-sm text-gray-300 hover:bg-gray-800 hover:text-rep-white">
          <div class="flex items-center space-x-2">
            <span>⚙️</span>
            <span>Settings</span>
          </div>
        </a>
        <a href="#" class="block px-4 py-2 text-sm text-gray-300 hover:bg-gray-800 hover:text-rep-white">
          <div class="flex items-center space-x-2">
            <span>🏢</span>
            <span>Organization</span>
          </div>
        </a>
        <hr class="my-1 border-gray-800">
        <button 
          (click)="logout()" 
          class="w-full text-left px-4 py-2 text-sm text-gray-300 hover:bg-gray-800 hover:text-rep-lime"
        >
          <div class="flex items-center space-x-2">
            <span>🚪</span>
            <span>Logout</span>
          </div>
        </button>
      </div>
    </div>
  </div>
</header>
