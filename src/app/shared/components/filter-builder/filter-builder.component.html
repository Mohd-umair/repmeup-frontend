<div class="rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-900 p-3 space-y-3">
  <div class="flex items-center justify-between gap-2">
    <div class="flex items-center gap-2 text-xs font-bold">
      <button type="button" (click)="setLogic('AND')"
        class="px-2 py-1 rounded-lg border"
        [class.bg-rep-lime]="value.logic === 'AND'"
        [class.border-rep-lime]="value.logic === 'AND'">AND</button>
      <button type="button" (click)="setLogic('OR')"
        class="px-2 py-1 rounded-lg border"
        [class.bg-rep-lime]="value.logic === 'OR'"
        [class.border-rep-lime]="value.logic === 'OR'">OR</button>
    </div>
    <button type="button" (click)="add()" class="text-xs font-semibold text-rep-black dark:text-rep-lime">
      <i class="fas fa-plus mr-1"></i> Add filter
    </button>
  </div>

  <div *ngIf="!value.conditions?.length" class="text-xs text-gray-500 dark:text-gray-400">
    No filters yet. Add one to narrow the list.
  </div>

  <div *ngFor="let c of value.conditions; let i = index" class="grid grid-cols-12 gap-2 items-end">
    <div class="col-span-4 min-w-0">
      <app-premium-select
        size="sm"
        [options]="fieldSelectOptions()"
        [value]="c.field"
        placeholder="Field"
        (valueChange)="c.field = $event; onFieldChange(c)" />
    </div>
    <div *ngIf="fieldMeta(c.field).type !== 'campaign'" class="col-span-3 min-w-0">
      <app-premium-select
        size="sm"
        [options]="operatorSelectOptions()"
        [value]="c.operator"
        placeholder="Operator"
        (valueChange)="c.operator = $event; emit()" />
    </div>
    <div *ngIf="fieldMeta(c.field).type === 'select'" class="col-span-4 min-w-0">
      <app-premium-select
        size="sm"
        [options]="valueSelectOptions(c)"
        [value]="$any(c.value) || ''"
        placeholder="Value"
        (valueChange)="c.value = $event; emit()" />
    </div>
    <ng-container *ngIf="fieldMeta(c.field).type === 'campaign'">
      <div class="col-span-3 min-w-0">
        <app-premium-select
          size="sm"
          [options]="campaignCondOptions()"
          [value]="campaignVal(c).condition"
          placeholder="Condition"
          (valueChange)="setCampaignValue(c, 'condition', $event)" />
      </div>
      <div class="col-span-4 min-w-0">
        <app-premium-select
          size="sm"
          [options]="campaignOptions()"
          [value]="campaignVal(c).campaignId"
          placeholder="Choose campaign"
          (valueChange)="setCampaignValue(c, 'campaignId', $event)" />
      </div>
    </ng-container>
    <input *ngIf="fieldMeta(c.field).type !== 'select' && fieldMeta(c.field).type !== 'campaign'"
           class="col-span-4 text-xs rounded-xl border border-gray-200 dark:border-gray-600 bg-white dark:bg-gray-800 px-2.5 py-2"
           [(ngModel)]="c.value" (ngModelChange)="emit()" placeholder="Value" />
    <button type="button" (click)="remove(i)" class="col-span-1 text-red-500 pb-2" title="Remove">
      <i class="fas fa-times"></i>
    </button>
  </div>
</div>
